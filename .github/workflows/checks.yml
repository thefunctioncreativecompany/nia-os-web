# Checks (Ika, 2026-11-21): the same checks Claude runs before handing work over, run by GitHub
# on every pull request and every change to main. A pull request set to merge automatically goes
# into main (and so the live site) only when these pass.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Next.js writes the page types (PageProps, LayoutProps) the type check needs.
      - run: npx next typegen
      - run: npx tsc --noEmit
      # Errors fail; warnings are older slips (CLAUDE.md → Working notes).
      - run: npm run lint
      - run: npm test
