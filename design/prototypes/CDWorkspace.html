/* the editor page */
function TemplateDoc({ t, onExit }) {
  const schema = TEMPLATE_SCHEMAS[t.code];
  const sections = schema.sections;
  const blank = () => sections.map(initSection);
  const [doc, setDoc] = useState(() => ({ data: blank(), added: sections.map(s => !s.optional), paid: false }));
  const [past, setPast] = useState([]);
  const [future, setFuture] = useState([]);
  const [savedAt, setSavedAt] = useState(null);
  const [toast, setToast] = useState('');
  const lastPush = useRef(0), toastTimer = useRef(null), paletteRef = useRef(null);

  const flash = m => { setToast(m); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(''), 2400); };
  // Typing within 0.7s is one undo step; structural actions (force) are always their own step.
  const commit = (next, force) => {
    const now = Date.now();
    if (force || now - lastPush.current > 700) { setPast(p => [...p.slice(-80), doc]); lastPush.current = force ? 0 : now; }
    setFuture([]); setDoc(next); setSavedAt(new Date());
  };
  const setSection = (i, v, force) => commit({ ...doc, data: doc.data.map((d, j) => j === i ? v : d) }, force);
  const toggleAdded = (i, on) => commit({ ...doc, added: doc.added.map((a, j) => j === i ? on : a), data: on ? doc.data : doc.data.map((d, j) => j === i ? initSection(sections[j]) : d) }, true);
  const undo = () => { if (!past.length) return; setFuture(f => [doc, ...f]); setDoc(past[past.length - 1]); setPast(p => p.slice(0, -1)); lastPush.current = 0; };
  const redo = () => { if (!future.length) return; setPast(p => [...p, doc]); setDoc(future[0]); setFuture(f => f.slice(1)); lastPush.current = 0; };

  const visible = sections.map((s, i) => ({ s, i })).filter(({ i }) => doc.added[i]);
  const palette = sections.map((s, i) => ({ s, i })).filter(({ s, i }) => s.optional && !doc.added[i]);
  const filledCount = visible.filter(({ s, i }) => sectionHasContent(s, doc.data[i])).length;
  const ready = filledCount > 0;
  const lastTableIdx = [...visible].reverse().find(({ s }) => s.type === 'table')?.i;

  const runAction = a => {
    if (a === 'Add Section' || a === 'Add Block') { if (palette.length) paletteRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' }); else flash('Every section is already in this document.'); return; }
    if (a === 'Add Row' || a === 'Add Line Item') {
      if (lastTableIdx == null) return flash('Add a section with a table first.');
      const i = a === 'Add Line Item' ? sections.findIndex(s => s.title === 'Line Items') : lastTableIdx;
      setSection(i, [...doc.data[i], { id: uid() }], true); return;
    }
    if (a === 'Mark Paid') { commit({ ...doc, paid: !doc.paid }, true); return; }
    if (a === 'Print') { window.print(); return; }
    if (a === 'Send to Crew') { flash('Sending to crew connects to Cast & Crew in the app. Not part of this prototype.'); return; }
  };
  const actionIcon = a => ({ 'Add Section': Ic.plus, 'Add Block': Ic.plus, 'Add Row': Ic.plus, 'Add Line Item': Ic.plus, 'Print': Ic.download, 'Send to Crew': Ic.send, 'Mark Paid': Ic.check })[a];

  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', background: C.pageBg }}>
      <div className="no-print" style={{ height: 56, flexShrink: 0, display: 'flex', alignItems: 'center', gap: 12, padding: '0 20px', background: C.cardBg, borderBottom: `1px solid ${C.border}` }}>
        <Btn small icon={Ic.back} onClick={onExit}>Templates</Btn>
        <div style={{ width: 26, height: 26, borderRadius: '50%', background: C.orb, flexShrink: 0 }} />
        <div style={{ fontFamily: BODY, fontSize: 14, color: C.ink3, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>Templates <span style={{ color: C.ink4 }}>/</span> <span style={{ color: C.ink, fontWeight: 600 }}>{schema.name}</span></div>
        <div style={{ flex: 1 }} />
        <MonoLabel color={C.ink3}>{savedAt ? `All changes saved ✓ ${pad(savedAt.getHours())}:${pad(savedAt.getMinutes())}` : 'Draft'}</MonoLabel>
      </div>

      <div className="print-unclip" style={{ flex: 1, overflowY: 'auto' }}>
        <div style={{ maxWidth: 1320, margin: '0 auto', padding: '30px 36px 72px', display: 'flex', gap: 28, alignItems: 'flex-start', flexWrap: 'wrap' }}>
          {/* Editor */}
          <div id="doc-print" style={{ flex: '999 1 620px', minWidth: 0, background: C.cardBg, border: `1px solid ${C.border}`, borderRadius: 18, padding: '28px 32px 36px', position: 'relative' }}>
            <MonoLabel color={INK}>{schema.group}</MonoLabel>
            <h1 style={{ fontFamily: BODY, fontWeight: 800, fontStyle: 'italic', fontSize: 32, letterSpacing: '-.9px', color: C.ink, margin: '8px 0 6px' }}>{schema.name}</h1>
            <p style={{ fontFamily: BODY, fontSize: 14, color: C.ink3, lineHeight: 1.6, maxWidth: 720 }}>
              {schema.builder && visible.length === 0 ? `Start building your ${schema.name.toLowerCase()} by adding sections below.` : schema.description}
            </p>
            {doc.paid && <div style={{ position: 'absolute', right: 32, top: 28, transform: 'rotate(-8deg)', border: `2.5px solid ${INK}`, color: INK, borderRadius: 8, padding: '4px 12px', fontFamily: MONO, fontSize: 14, fontWeight: 700, letterSpacing: '.18em' }}>PAID</div>}

            <div className="no-print" style={{ display: 'flex', flexWrap: 'wrap', gap: 6, margin: '18px 0 4px', paddingBottom: 16, borderBottom: `1.5px solid ${C.ink}` }}>
              <Btn small icon={Ic.chevLeft} onClick={undo} disabled={!past.length} title="Undo">Undo</Btn>
              <Btn small icon={Ic.chevRight} onClick={redo} disabled={!future.length} title="Redo">Redo</Btn>
              <span style={{ width: 1, background: C.border, margin: '4px 4px' }} />
              {schema.actions.map(a => <Btn key={a} small icon={actionIcon(a)} onClick={() => runAction(a)}>{a === 'Mark Paid' && doc.paid ? 'Mark Unpaid' : a}</Btn>)}
            </div>

            {visible.map(({ s, i }) => (
              <section key={i} style={{ padding: '22px 0 6px', animation: 'nodeIn .25s ease both' }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
                  <h2 style={{ fontFamily: BODY, fontSize: 16, fontWeight: 800, letterSpacing: '-.3px', color: C.ink }}>{s.title}</h2>
                  {s.optional && <button className="no-print" onClick={() => toggleAdded(i, false)} style={{ background: 'none', border: 'none', fontFamily: BODY, fontSize: 12, color: C.ink4, cursor: 'pointer' }}>Remove section</button>}
                </div>
                <SectionBody s={s} v={doc.data[i]} set={v => setSection(i, v)} />
              </section>
            ))}

            {palette.length > 0 && (
              <div ref={paletteRef} className="no-print" style={{ marginTop: visible.length ? 30 : 22 }}>
                <SectionLabel sub={visible.length ? 'Add more sections as the plan grows.' : 'Pick the sections this one needs. You can remove them later.'}>Add sections</SectionLabel>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(min(100%, 250px), 1fr))', gap: 10 }}>
                  {palette.map(({ s, i }) => (
                    <button key={i} onClick={() => toggleAdded(i, true)}
                      style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '13px 14px', border: `1px solid ${C.border}`, borderRadius: 12, background: C.pageBg, cursor: 'pointer', textAlign: 'left', transition: 'all .13s' }}
                      onMouseEnter={e => { e.currentTarget.style.borderColor = INK; e.currentTarget.style.background = '#F2F2F0'; }} onMouseLeave={e => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.background = C.pageBg; }}>
                      <span style={{ flex: 1, minWidth: 0 }}>
                        <span style={{ display: 'block', fontFamily: BODY, fontSize: 13.5, fontWeight: 600, color: C.ink }}>{s.title}</span>
                        <span style={{ display: 'block', fontFamily: BODY, fontSize: 12, color: C.ink3, marginTop: 2 }}>{s.hint}</span>
                      </span>
                      <span style={{ fontFamily: BODY, fontSize: 12.5, fontWeight: 600, color: INK, whiteSpace: 'nowrap' }}>+ Add</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Preview & export */}
          <aside className="no-print" style={{ flex: '1 1 300px', maxWidth: 360, position: 'sticky', top: 0 }}>
            <div style={{ background: C.cardBg, border: `1px solid ${C.border}`, borderRadius: 18, padding: '18px 18px 16px' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
                <MonoLabel color={C.ink3}>Preview</MonoLabel>
                <Chip small label={ready ? 'Ready to Export' : 'Draft'} color={ready ? INK : C.ink3} />
              </div>
              {/* paper thumbnail */}
              <div style={{ position: 'relative', borderRadius: 12, overflow: 'hidden', height: 150, background: '#F4F4F2', border: `1px solid ${C.border}`, marginBottom: 14 }}>
                <div style={{ position: 'absolute', left: '50%', top: 18, width: 150, height: 170, transform: 'translateX(-50%)', background: '#fff', borderRadius: 6, border: `1px solid ${C.borderMd}`, padding: '14px 14px' }}>
                  <div style={{ height: 6, width: '60%', background: C.ink, borderRadius: 2, marginBottom: 10 }} />
                  {visible.slice(0, 6).map(({ s, i }) => (
                    <div key={i} style={{ marginBottom: 8 }}>
                      <div style={{ height: 3, width: '40%', background: C.ink3, borderRadius: 2, marginBottom: 4 }} />
                      <div style={{ height: 3, width: sectionHasContent(s, doc.data[i]) ? '92%' : '30%', background: sectionHasContent(s, doc.data[i]) ? INK : C.border, borderRadius: 2, transition: 'width .3s' }} />
                    </div>
                  ))}
                </div>
              </div>
              <div style={{ fontFamily: BODY, fontSize: 15, fontWeight: 700, color: C.ink, letterSpacing: '-.2px' }}>{schema.name}</div>
              <p style={{ fontFamily: BODY, fontSize: 12.5, color: C.ink3, lineHeight: 1.55, margin: '6px 0 10px' }}>{schema.description}</p>
              <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'flex', flexDirection: 'column', gap: 6 }}>
                {schema.contents.map(c => {
                  const [k, ...rest] = c.split(':');
                  return <li key={c} style={{ display: 'flex', gap: 8, fontFamily: BODY, fontSize: 12.5, color: C.ink2, lineHeight: 1.45 }}><span style={{ color: INK }}>•</span><span><strong style={{ fontWeight: 600, color: C.ink }}>{k}</strong>{rest.length ? ':' + rest.join(':') : ''}</span></li>;
                })}
              </ul>
              <div style={{ height: 1, background: C.border, margin: '14px 0 10px' }} />
              <MonoLabel style={{ marginBottom: 8 }}>{filledCount} / {visible.length || (schema.builder ? 0 : sections.length)} sections filled</MonoLabel>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 5, marginBottom: 14 }}>
                {visible.map(({ s, i }) => {
                  const ok = sectionHasContent(s, doc.data[i]);
                  return <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, fontFamily: BODY, fontSize: 12.5, color: ok ? C.ink : C.ink4 }}>
                    <span style={{ width: 16, height: 16, borderRadius: '50%', flexShrink: 0, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: ok ? INK : 'transparent', border: `1px solid ${ok ? INK : C.borderMd}`, color: '#fff' }}>{ok && <Icon ic={Ic.check} size={8} />}</span>{s.title}
                  </div>;
                })}
                {visible.length === 0 && <div style={{ fontFamily: BODY, fontSize: 12.5, color: C.ink4 }}>Add sections to build the preview.</div>}
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <div style={{ flex: 1 }}><Btn icon={Ic.download} onClick={() => window.print()}>Download PDF</Btn></div>
                <Btn variant="ink" icon={Ic.check} onClick={() => flash('Saved. In the app this saves to the project.')}>Save</Btn>
              </div>
              <div style={{ fontFamily: MONO, fontSize: 9, letterSpacing: '.06em', color: C.ink4, marginTop: 12, textTransform: 'uppercase' }}>Generated by Nia · {schema.version}</div>
            </div>
          </aside>
        </div>
      </div>
      <Toast msg={toast} />
    </div>
  );
}

/* ─── WORKSPACE SHELL ────────────────────────────────────────── */
function ProjectWorkspace({ template, projectName, task, onExit }) {
  const steps = template.steps, total = steps.length;
  const [state, setState] = useState({ activeStep: 1, completed: [], projectData: initialProjectData(projectName, task) });
  const [view, setView] = useState('map');
  const [panelOpen, setPanelOpen] = useState(false);
  const { activeStep, completed, projectData } = state;
  const step = steps[activeStep - 1];
  const isDone = completed.includes(activeStep);

  const setData = (key, value) => setState(s => ({ ...s, projectData: { ...s.projectData, [key]: value } }));
  const goTo = n => setState(s => ({ ...s, activeStep: n }));
  const openStep = n => { goTo(n); setPanelOpen(true); };
  const toggleComplete = () => setState(s => ({ ...s, completed: s.completed.includes(s.activeStep) ? s.completed.filter(x => x !== s.activeStep) : [...s.completed, s.activeStep] }));
  const completeAndNext = () => setState(s => ({
    ...s,
    completed: s.completed.includes(s.activeStep) ? s.completed : [...s.completed, s.activeStep],
    activeStep: Math.min(total, s.activeStep + 1),
  }));

  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') setPanelOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const renderModule = () => {
    if (activeStep <= 3) return <BlueprintModule step={activeStep} data={projectData} setData={setData} goTo={goTo} />;
    if (activeStep === 7) return <TeamModule team={projectData.team} setTeam={v => setData('team', v)} />;
    if (activeStep === 8) return <ShotPlanModule shots={projectData.shots} setShots={v => setData('shots', v)} />;
    if (activeStep === 9) return <CallsheetModule data={projectData} setData={setData} goTo={goTo} />;
    return <StepNotes step={step} value={projectData.notes[activeStep]} onChange={v => setData('notes', { ...projectData.notes, [activeStep]: v })} />;
  };
  const body = compact => (
    <StepBody step={step} total={total} isDone={isDone} compact={compact} module={renderModule()}
      goTo={goTo} toggleComplete={toggleComplete} completeAndNext={completeAndNext} />
  );
  const PANEL_W = 'min(700px, 60vw)';

  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', background: C.pageBg }}>
      {/* Top bar */}
      <div className="no-print" style={{ height: 56, flexShrink: 0, display: 'flex', alignItems: 'center', gap: 14, padding: '0 20px', background: C.cardBg, borderBottom: `1px solid ${C.border}` }}>
        <Btn small icon={Ic.back} onClick={onExit}>Templates</Btn>
        <div style={{ width: 26, height: 26, borderRadius: '50%', background: C.orb, flexShrink: 0 }} />
        <div style={{ fontFamily: BODY, fontWeight: 700, fontSize: 15, color: C.ink, letterSpacing: '-.2px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{projectName}</div>
        <Chip small label={task} />
        <span title={template.summary}><Chip small label={`Template · ${template.name}`} color={C.ink3} /></span>
        <div style={{ flex: 1 }} />
        <ViewToggle view={view} setView={setView} />
        <MonoLabel color={C.ink3}>{pad(completed.length)} / {total} complete</MonoLabel>
      </div>

      {view === 'list' ? (
        <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
          {/* Sidebar */}
          <aside className="no-print" style={{ width: 252, flexShrink: 0, background: C.pageBg, borderRight: `1px solid ${C.border}`, overflowY: 'auto', padding: '18px 12px 24px' }}>
            <div style={{ padding: '0 10px 16px' }}>
              <div style={{ height: 3, background: C.border, borderRadius: 2, overflow: 'hidden' }}>
                <div style={{ width: `${(completed.length / total) * 100}%`, height: '100%', background: C.teal, transition: 'width .3s ease' }} />
              </div>
            </div>
            {template.stages.map(ph => (
              <div key={ph} style={{ marginBottom: 14 }}>
                <MonoLabel style={{ padding: '0 10px 6px' }}>{ph}</MonoLabel>
                {steps.filter(s => s.phase === ph).map(s => (
                  <StepItem key={s.n} step={s} active={s.n === activeStep} done={completed.includes(s.n)} onClick={() => goTo(s.n)} />
                ))}
              </div>
            ))}
          </aside>

          {/* Main */}
          <main className="print-unclip" style={{ flex: 1, overflowY: 'auto', background: C.cardBg }}>
            <div style={{ maxWidth: 1080, margin: '0 auto', padding: '34px 44px 64px' }}>{body(false)}</div>
          </main>
        </div>
      ) : (
        <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
          <MapView template={template} completed={completed} activeStep={activeStep} panelOpen={panelOpen} projectData={projectData} onOpen={openStep} />

          {/* Step panel */}
          <aside className="print-unclip" style={{ width: panelOpen ? PANEL_W : 0, flexShrink: 0, overflow: 'hidden', background: C.cardBg, borderLeft: panelOpen ? `1px solid ${C.border}` : 'none', boxShadow: panelOpen ? '-10px 0 30px rgba(15,14,12,.05)' : 'none', transition: 'width .24s ease' }}>
            <div className="print-unclip" style={{ width: PANEL_W, height: '100%', overflowY: 'auto' }}>
              <div className="no-print" style={{ position: 'sticky', top: 0, zIndex: 5, display: 'flex', alignItems: 'center', gap: 6, padding: '10px 16px', background: 'rgba(255,255,255,.94)', backdropFilter: 'blur(6px)', borderBottom: `1px solid ${C.border}` }}>
                <Btn small icon={Ic.chevLeft} disabled={activeStep === 1} onClick={() => goTo(activeStep - 1)} title="Previous step" />
                <Btn small icon={Ic.chevRight} disabled={activeStep === total} onClick={() => goTo(activeStep + 1)} title="Next step" />
                <div style={{ flex: 1 }} />
                <Btn small icon={Ic.launch} onClick={() => { setView('list'); setPanelOpen(false); }}>Open in list</Btn>
                <Btn small icon={Ic.close} onClick={() => setPanelOpen(false)} title="Close (Esc)" />
              </div>
              {panelOpen && <div style={{ padding: '22px 30px 48px' }}>{body(true)}</div>}
            </div>
          </aside>
        </div>
      )}
    </div>
  );
}

/* ─── ROOT: templates gallery → launcher → workspace ─────────── */
function NiaTemplatesApp() {
  const [picked, setPicked] = useState(null);   // template waiting on the launcher
  const [session, setSession] = useState(null);
  const [doc, setDoc] = useState(null);       // document template open in the engine
  if (doc) return <TemplateDoc key={doc.code} t={doc} onExit={() => setDoc(null)} />;
  if (session) {
    return <ProjectWorkspace template={session.template} projectName={session.project} task={session.task} onExit={() => setSession(null)} />;
  }
  return (
    <>
      <TemplatesGallery catalog={CATALOG} onUse={t => setPicked(t)} onOpenDoc={t => setDoc(t)} />
      {picked && (
        <ProjectLauncher template={picked} task={picked.launch.task} domain={picked.launch.domain}
          onClose={() => setPicked(null)} onLaunch={s => { setSession({ ...s, template: picked }); setPicked(null); }} />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<NiaTemplatesApp />);
  </script>
</body>
