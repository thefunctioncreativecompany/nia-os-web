<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nOS Templates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; }
    body { background: #EFEEEA; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.3); }
    input::placeholder, textarea::placeholder { color: #A8A8A3; }
    /* Print: only the call sheet leaves the building */
    @media print {
      body { background: #fff; }
      body * { visibility: hidden; }
      #callsheet-print, #callsheet-print * { visibility: visible; }
      #callsheet-print { position: absolute; left: 0; top: 0; width: 100%; border: none !important; box-shadow: none !important; }
      .no-print { display: none !important; }
      .print-unclip { overflow: visible !important; height: auto !important; box-shadow: none !important; border: none !important; }
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .art-float { animation: float 7s ease-in-out infinite; }
    .hide-scroll { scrollbar-width: none; } .hide-scroll::-webkit-scrollbar { display: none; }
    @media (prefers-reduced-motion: reduce) { .art-float { animation: none; } }
    @keyframes popIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes nodeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Preview only: in nia-client2 the JSX below is compiled by the app's build, so drop this line. -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
/**
 * nOS — Creative Director Workspace
 * v2.1 — The pipeline is now Template 01 of the Templates feature, with two views.
 *
 * Render flow:
 *   no session  → <TemplatesGallery/>; choosing a template opens <ProjectLauncher template/>
 *   session set → <ProjectWorkspace template projectName task/>
 *                   view 'map'  → <MapView/> canvas + step panel
 *                   view 'list' → sidebar + full-width step
 *
 * A template = stages + steps, where each step declares what it requires and
 * what it delivers. The map is drawn from that data, so new templates
 * (music video, campaign, lookbook…) need data, not new screens.
 *
 * Built modules: Blueprint (steps 1–3), Team Assembly (7), Shot Plan (8), Callsheet (9).
 * Steps 4, 5, 6, 10, 11 hold working notes until their modules are designed.
 */
const { useState, useRef, useEffect, useMemo } = React;

/* ─── TOKENS (unchanged) ─────────────────────────────────────── */
const BODY = "'DM Sans', 'Helvetica Neue', Arial, sans-serif";
const MONO = "'SF Mono', 'Fira Code', monospace";
const C = {
  pageBg: '#EFEEEA', cardBg: '#FFFFFF',
  ink: '#0F0E0C', ink2: '#3A3A37', ink3: '#6E6E6A', ink4: '#A8A8A3',
  border: 'rgba(15,14,12,.08)', borderMd: 'rgba(15,14,12,.13)',
  teal: '#0B7A75', tealLight: '#E8F4F3', tealSoft: 'rgba(11,122,117,.1)',
  orb: 'radial-gradient(circle at 42% 38%, #E05018 0%, #C02810 22%, #3C1860 48%, #180E40 72%, #080620 100%)',
};

/* ─── SVG ICONS (unchanged set) ──────────────────────────────── */
const Svg = ({ w = 18, vb = '0 0 20 20', sw = 1.5, solid, children }) => (

       stroke={solid ? 'none' : 'currentColor'} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const Ic = {
  overview: <Svg><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></Svg>,
  workflow: <Svg><circle cx="3.5" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="16.5" cy="10" r="1.5"/><path d="M5 10h3M11.5 10h3"/></Svg>,
  tasks: <Svg><path d="M3 5h14M3 10h9M3 15h11"/></Svg>,
  nos: <Svg><polygon points="10,2 18,7 18,13 10,18 2,13 2,7"/><circle cx="10" cy="10" r="2.5"/></Svg>,
  ask: <Svg><path d="M10 2C5.6 2 2 5.1 2 9c0 2.1.9 4 2.4 5.3L4 18l3.8-1.4C8.5 16.9 9.2 17 10 17c4.4 0 8-3.1 8-7s-3.6-8-8-8z"/><path d="M10 8v.01M10 11v2"/></Svg>,
  integrations: <Svg><circle cx="5" cy="5" r="2"/><circle cx="15" cy="5" r="2"/><circle cx="5" cy="15" r="2"/><circle cx="15" cy="15" r="2"/><path d="M7 5h6M5 7v6M15 7v6M7 15h6"/></Svg>,
  back: <Svg w={16} vb="0 0 16 16" sw={1.6}><path d="M10 3L5 8l5 5"/></Svg>,
  spark: <Svg w={13} vb="0 0 16 16" solid><path d="M8 1l1.8 4.8L15 6.5l-3.6 3.2 1.1 4.8L8 12 4.5 14.5l1.1-4.8L2 6.5l5.2-.7z"/></Svg>,
  plus: <Svg w={12} vb="0 0 16 16" sw={2}><path d="M8 2v12M2 8h12"/></Svg>,

  check: <Svg w={12} vb="0 0 14 14" sw={2}><path d="M2 7l4 4 6-7"/></Svg>,
  user: <Svg w={13} vb="0 0 20 20" sw={2}><circle cx="10" cy="7" r="4"/><path d="M3 18c0-3.3 3.1-6 7-6s7 2.7 7 6"/></Svg>,
  connect: <Svg w={13} vb="0 0 16 16" sw={1.6}><circle cx="4" cy="8" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="12" cy="12" r="2"/><path d="M6 7.2l4-2.4M6 8.8l4 2.4"/></Svg>,
  chevDown: <Svg w={11} vb="0 0 12 12" sw={1.8}><path d="M2 4l4 4 4-4"/></Svg>,
  chevLeft: <Svg w={12} vb="0 0 12 12" sw={1.8}><path d="M8 2L4 6l4 4"/></Svg>,
  chevRight: <Svg w={12} vb="0 0 12 12" sw={1.8}><path d="M4 2l4 4-4 4"/></Svg>,
  close: <Svg w={10} vb="0 0 13 13" sw={1.8}><path d="M2 2l9 9M11 2L2 11"/></Svg>,
  send: <Svg w={14} vb="0 0 20 20" sw={1.6}><path d="M18 2L2 8l6 4 8-8-8 8 4 6z"/></Svg>,
  download: <Svg w={13} vb="0 0 16 16" sw={1.6}><path d="M8 2v8M5 7l3 3 3-3M2 13h12"/></Svg>,
  launch: <Svg w={12} vb="0 0 16 16" sw={1.6}><path d="M7 3H3a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1V9M10 2h4v4M14 2L8 8"/></Svg>,
  /* added for the map view */
  mapView: <Svg w={13} vb="0 0 20 20" sw={1.6}><rect x="1.5" y="2.5" width="7" height="5.5" rx="1.5"/><rect x="11.5" y="12" width="7" height="5.5" rx="1.5"/><path d="M8.5 5.25H10v9.5h1.5"/></Svg>,
  listView: <Svg w={13} vb="0 0 20 20" sw={1.6}><path d="M7 5h11M7 10h11M7 15h11"/><circle cx="3" cy="5" r=".6"/><circle cx="3" cy="10" r=".6"/><circle cx="3" cy="15" r=".6"/></Svg>,

  search: <Svg w={18} vb="0 0 20 20" sw={1.7}><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></Svg>,
  cardsView: <Svg w={13} vb="0 0 20 20" sw={1.6}><rect x="2" y="4" width="10" height="12" rx="2"/><path d="M15 5v10M18 6.5v7"/></Svg>,
  gridView: <Svg w={13} vb="0 0 20 20" sw={1.6}><rect x="2.5" y="3" width="15" height="4" rx="1.3"/><rect x="2.5" y="8.5" width="15" height="4" rx="1.3"/><rect x="2.5" y="14" width="15" height="3.5" rx="1.3"/></Svg>,
};

/* ─── ATOMS (existing Nia components) ────────────────────────── */
const Icon = ({ ic, size = 16, color, style = {} }) => (
  <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: size, height: size, color: color || 'currentColor', flexShrink: 0, ...style }}>{ic}</span>
);
const Chip = ({ label, small, color }) => (
  <span style={{ display: 'inline-block', fontFamily: MONO, fontSize: small ? 9 : 10.5, fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase', background: color ? color + '18' : C.tealSoft, color: color || C.teal, padding: small ? '3px 8px' : '4px 10px', borderRadius: 20, whiteSpace: 'nowrap' }}>{label}</span>
);
const SectionLabel = ({ children, sub }) => (
  <div style={{ marginBottom: sub ? 14 : 12 }}>
    <div style={{ fontFamily: BODY, fontSize: 17, fontWeight: 800, letterSpacing: '-.3px', color: C.ink, marginBottom: sub ? 4 : 0, lineHeight: 1.2 }}>{children}</div>
    {sub && <div style={{ fontFamily: BODY, fontSize: 12.5, color: C.ink4, lineHeight: 1.55 }}>{sub}</div>}
  </div>
);
const Divider = () => <div style={{ height: 1, background: C.border, margin: '24px 0' }} />;
const MonoLabel = ({ children, color = C.ink4, style = {} }) => (
  <div style={{ fontFamily: MONO, fontSize: 9.5, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color, ...style }}>{children}</div>
);

/* Pill button — same hover language as the original (ghost → #E8E7E3, primary → opacity) */
function Btn({ children, onClick, icon, variant = 'ghost', disabled, small, title }) {
  const [h, setH] = useState(false);
  const primary = variant === 'primary';
  const look = primary
    ? { background: C.teal, border: `1px solid ${C.teal}`, color: '#fff', opacity: disabled ? .45 : h ? .88 : 1 }
    : { background: h && !disabled ? '#E8E7E3' : C.pageBg, border: `1px solid ${h && !disabled ? C.borderMd : C.border}`, color: C.ink2, opacity: disabled ? .45 : 1 };
  return (
    <button title={title} disabled={disabled} onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ display: 'inline-flex', alignItems: 'center', gap: 6, height: small ? 28 : 34, padding: small ? '0 11px' : '0 15px', borderRadius: 20, fontFamily: BODY, fontSize: small ? 12 : 12.5, fontWeight: primary ? 600 : 500, cursor: disabled ? 'default' : 'pointer', transition: 'all .13s', whiteSpace: 'nowrap', ...look }}>
      {icon && <Icon ic={icon} size={small ? 11 : 12} style={{ opacity: primary ? 1 : .6 }} />}
      {children}
    </button>
  );
}

/* Labelled input / textarea */
function Field({ label, value, onChange, placeholder, multiline, rows = 4, type = 'text', large, span }) {
  const [f, setF] = useState(false);
  const style = {
    width: '100%', border: `1.5px solid ${f ? C.teal : C.borderMd}`, borderRadius: 10, padding: large ? '14px 16px' : '10px 13px',
    fontFamily: BODY, fontSize: large ? 18 : 13.5, fontWeight: large ? 500 : 400, letterSpacing: large ? '-.2px' : 0,
    color: C.ink, background: f ? C.cardBg : C.pageBg, outline: 'none', resize: 'vertical', lineHeight: 1.6, transition: 'all .13s',
  };
  const common = { value, placeholder, style, onFocus: () => setF(true), onBlur: () => setF(false), onChange: e => onChange(e.target.value) };
  return (
    <label style={{ display: 'block', gridColumn: span ? '1 / -1' : 'auto' }}>
      <MonoLabel style={{ marginBottom: 6 }}>{label}</MonoLabel>
      {multiline ? <textarea rows={rows} {...common} /> : <input type={type} {...common} />}
    </label>
  );
}

/* Borderless cell input for the data tables */
function CellInput({ value, onChange, placeholder, mono, align, type = 'text' }) {
  const [f, setF] = useState(false);
  return (
    <input type={type} value={value} placeholder={placeholder} onChange={e => onChange(e.target.value)}
      onFocus={() => setF(true)} onBlur={() => setF(false)}
      style={{ width: '100%', border: 'none', outline: 'none', background: f ? C.tealLight : 'transparent', fontFamily: mono ? MONO : BODY, fontSize: mono ? 12 : 12.5, color: C.ink, padding: '9px 10px', textAlign: align || 'left', transition: 'background .12s' }} />
  );
}

/* ─── HELPERS ────────────────────────────────────────────────── */
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const toMin = t => { if (!t) return 0; const [h, m] = t.split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const fmtClock = m => { const x = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(x / 60)) + ':' + pad(x % 60); };
const fmtDur = m => { const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h ${pad(r)}m` : `${r}m`; };

const th = { fontFamily: MONO, fontSize: 9, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: C.ink4, textAlign: 'left', padding: '9px 10px', background: C.pageBg, border: `1px solid ${C.borderMd}`, whiteSpace: 'nowrap' };
const td = { border: `1px solid ${C.borderMd}`, padding: 0, verticalAlign: 'middle' };

/* ─── PIPELINE DEFINITION ────────────────────────────────────── */
/* requires: steps whose output this step builds on (drives map edges + availability)
   delivers: what the step hands to the rest of the production
   map:      { sub: column inside its stage, row: vertical slot } — hand-placed so no line crosses a card */
const STEPS = [
  { n: 1,  label: 'Vision',                 phase: 'Blueprint',      requires: [],        delivers: 'Direction statement', map: { sub: 0, row: 1 }, desc: 'The single direction every decision on this shoot answers to.' },
  { n: 2,  label: 'Concept Blueprint',      phase: 'Blueprint',      requires: [1],       delivers: 'Concept & deliverables', map: { sub: 1, row: 0 }, desc: 'The vision translated into a concept the team can build.' },
  { n: 3,  label: 'Mood References',        phase: 'Blueprint',      requires: [1],       delivers: 'Reference board',     map: { sub: 1, row: 2 }, desc: 'The visual language: light, palette, styling, casting, place.' },
  { n: 4,  label: 'Location Scouting',      phase: 'Pre-production', requires: [2, 3],    delivers: 'Confirmed location',  map: { sub: 0, row: 0 }, desc: 'Shortlist, recce and confirm where the day happens.' },
  { n: 5,  label: 'Talent Casting',         phase: 'Pre-production', requires: [2, 3],    delivers: 'Confirmed talent',    map: { sub: 0, row: 1 }, desc: 'Who is in front of the camera, and when they are available.' },
  { n: 6,  label: 'Styling & Wardrobe',     phase: 'Pre-production', requires: [3, 5],    delivers: 'Look list',           map: { sub: 1, row: 2 }, desc: 'Looks, pulls, fittings and returns.' },
  { n: 7,  label: 'Team Assembly',          phase: 'Pre-production', requires: [2],       delivers: 'Crew & call times',   map: { sub: 0, row: 3 }, desc: 'Who is behind the camera, and when each person is called.' },
  { n: 8,  label: 'Shot Planning',          phase: 'Shoot',          requires: [4, 5, 6], delivers: 'Shot list',           map: { sub: 0, row: 1 }, desc: 'Every frame in order, with its location, cast, setup and running time.' },
  { n: 9,  label: 'Callsheet Distribution', phase: 'Shoot',          requires: [7, 8],    delivers: 'Call sheet',          map: { sub: 1, row: 2 }, desc: 'The day, compiled from the shot plan and the team.' },
  { n: 10, label: 'Contingency (Plan B)',   phase: 'Safeguards',     requires: [8],       delivers: 'Plan B',              map: { sub: 0, row: 0 }, desc: 'What happens if weather, talent or light falls through.' },
  { n: 11, label: 'Gear Inventory',         phase: 'Safeguards',     requires: [8],       delivers: 'Kit list',            map: { sub: 0, row: 2 }, desc: "What's owned, rented, packed and backed up." },
];
const PHASES = ['Blueprint', 'Pre-production', 'Shoot', 'Safeguards'];
const REF_TAGS = ['Light', 'Palette', 'Styling', 'Casting', 'Location'];
const SHOT_STATUS = [
  { label: 'Planned', color: C.ink3 },
  { label: 'Ready',   color: C.teal },
  { label: 'Shot',    color: C.ink },
];
/* ─── TEMPLATES ──────────────────────────────────────────────────
   Template 01. Every future template follows this shape. */
const CD_TEMPLATE = {
  id: 'cd-editorial-shoot', index: 1,
  archetype: 'Creative Director', name: 'Editorial Shoot',
  summary: 'From vision to call sheet: the pre-production path for a fashion or editorial shoot.',

  label: 'New template', stage: 'Pre-production',
  art: 'canister', tone: 'radial-gradient(120% 95% at 50% 28%, #A6E2DB 0%, #3BA59D 34%, #0B6460 66%, #052826 100%)',
  stages: PHASES, steps: STEPS,
};
/* The full catalogue: generated from templates.manifest.json (keep the two in sync). */

function ProjectLauncher({ template, task, domain, onClose, onLaunch }) {
  const [mode, setMode] = useState(null);
  const [selected, setSelected] = useState(null);
  const [newName, setNewName] = useState('');
  const projectName = mode === 'new' ? newName.trim() : selected?.name;
  const canLaunch = mode === 'existing' ? !!selected : mode === 'new' && newName.trim().length > 0;

  // No AI summary: launching hands straight over to the workspace.
  const handleLaunch = () => { if (canLaunch) onLaunch?.({ task, project: projectName, isNew: mode === 'new' }); };

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 600, background: 'rgba(15,14,12,.52)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center' }} onClick={onClose}>
      <div style={{ background: C.cardBg, borderRadius: '20px 20px 0 0', width: '100%', maxWidth: 600, padding: '12px 28px 44px', boxShadow: '0 -8px 40px rgba(0,0,0,.18)' }} onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 22 }}>
          <div style={{ width: 36, height: 4, borderRadius: 2, background: C.border }} />
        </div>
        <div style={{ marginBottom: 22 }}>
          <MonoLabel color={C.teal} style={{ marginBottom: 7 }}>{domain}</MonoLabel>
          <div style={{ fontFamily: BODY, fontWeight: 700, fontSize: 20, color: C.ink, letterSpacing: '-.3px', lineHeight: 1.25, marginBottom: 6 }}>{task}</div>
          <div style={{ fontFamily: BODY, fontSize: 13, color: C.ink3, lineHeight: 1.65 }}>Attach this task to a project and Nia opens its pre-production workspace.</div>
        </div>
        {template && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '12px 14px', marginBottom: 18, borderRadius: 12, border: `1px dashed ${C.borderMd}` }}>
            <div style={{ position: 'relative', width: 44, height: 44, borderRadius: 9, overflow: 'hidden', flexShrink: 0 }}><TemplateArt t={template} thumb /></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <MonoLabel color={C.teal} style={{ marginBottom: 3 }}>{template.label}</MonoLabel>
              <div style={{ fontFamily: BODY, fontSize: 13, color: C.ink, fontWeight: 600 }}>{template.name} <span style={{ color: C.ink4, fontWeight: 400 }}>· {template.stage}</span></div>
            </div>
          </div>
        )}

        {!mode && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {[{ id: 'existing', title: 'Add to existing project', sub: 'Choose from your current projects' },
              { id: 'new', title: 'Start a new project', sub: 'Create a new project around this task' }].map(opt => (
              <button key={opt.id} onClick={() => setMode(opt.id)}
                style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 16px', background: C.pageBg, border: `1px solid ${C.border}`, borderRadius: 12, cursor: 'pointer', transition: 'all .13s', textAlign: 'left' }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = C.teal; e.currentTarget.style.background = C.tealLight; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.background = C.pageBg; }}>

                  <div style={{ fontFamily: BODY, fontWeight: 600, fontSize: 13.5, color: C.ink, marginBottom: 2 }}>{opt.title}</div>
                  <div style={{ fontFamily: BODY, fontSize: 12, color: C.ink4 }}>{opt.sub}</div>
                </div>
                <Icon ic={Ic.arrow} size={11} style={{ opacity: .5 }} />
              </button>
            ))}
          </div>
        )}

        {mode === 'existing' && (
          <>
            <button onClick={() => { setMode(null); setSelected(null); }} style={{ fontFamily: BODY, fontSize: 12, color: C.ink4, background: 'none', border: 'none', cursor: 'pointer', padding: '0 0 14px' }}>← Back</button>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 7, marginBottom: 18 }}>
              {EXISTING_PROJECTS.map(p => {
                const sel = selected?.id === p.id;
                return (
                  <button key={p.id} onClick={() => setSelected(p)}
                    style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px', background: sel ? C.tealLight : C.pageBg, border: `1.5px solid ${sel ? C.teal : C.border}`, borderRadius: 10, cursor: 'pointer', transition: 'all .12s', textAlign: 'left' }}>
                    <div style={{ width: 8, height: 8, borderRadius: '50%', background: sel ? C.teal : C.ink4, flexShrink: 0 }} />
                    <span style={{ fontFamily: BODY, fontSize: 13, color: sel ? C.teal : C.ink, fontWeight: sel ? 600 : 400 }}>{p.name}</span>
                  </button>
                );
              })}
            </div>
          </>
        )}

        {mode === 'new' && (
          <>
            <button onClick={() => { setMode(null); setNewName(''); }} style={{ fontFamily: BODY, fontSize: 12, color: C.ink4, background: 'none', border: 'none', cursor: 'pointer', padding: '0 0 14px' }}>← Back</button>
            <SectionLabel>Project name</SectionLabel>
            <input value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLaunch()} autoFocus
              placeholder="e.g. Thebe Magugu — AW25 Campaign"
              style={{ width: '100%', border: `1.5px solid ${C.teal}`, borderRadius: 10, padding: '11px 14px', fontFamily: BODY, fontSize: 13.5, color: C.ink, background: C.pageBg, outline: 'none', marginBottom: 18 }} />
          </>
        )}

        {mode && (
          <button onClick={handleLaunch} disabled={!canLaunch}
            style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, padding: '14px 0', background: canLaunch ? C.teal : C.border, border: 'none', borderRadius: 12, fontFamily: BODY, fontSize: 14, fontWeight: 600, color: canLaunch ? '#fff' : C.ink4, cursor: canLaunch ? 'pointer' : 'default', transition: 'all .15s' }}
            onMouseEnter={e => { if (canLaunch) e.currentTarget.style.opacity = '.88'; }}
            onMouseLeave={e => { e.currentTarget.style.opacity = '1'; }}>
            <Icon ic={Ic.spark} size={14} />
            {mode === 'new' ? 'Create project & start task' : `Add to ${projectName || 'project'}`}
          </button>
        )}
      </div>
    </div>
  );
}

function MoodReferences({ refs, setRefs }) {
  const [over, setOver] = useState(false);
  const [filter, setFilter] = useState('All');
  const fileRef = useRef(null);

  const readFiles = async files => {
    const imgs = [...files].filter(f => f.type.startsWith('image/'));
    const loaded = await Promise.all(imgs.map(f => new Promise(res => {
      const rd = new FileReader();
      rd.onload = e => res({ id: uid(), src: e.target.result, caption: f.name.replace(/\.[^.]+$/, ''), tag: 'Light' });
      rd.readAsDataURL(f);
    })));
    setRefs([...refs, ...loaded]);
  };
  const update = (id, patch) => setRefs(refs.map(r => r.id === id ? { ...r, ...patch } : r));
  const cycleTag = r => update(r.id, { tag: REF_TAGS[(REF_TAGS.indexOf(r.tag) + 1) % REF_TAGS.length] });
  const shown = filter === 'All' ? refs : refs.filter(r => r.tag === filter);

  return (
    <div>
      <div onClick={() => fileRef.current?.click()}
        onDragOver={e => { e.preventDefault(); setOver(true); }} onDragLeave={() => setOver(false)}
        onDrop={e => { e.preventDefault(); setOver(false); readFiles(e.dataTransfer.files); }}
        style={{ border: `1.5px dashed ${C.teal}`, borderRadius: 14, padding: '30px 20px', textAlign: 'center', cursor: 'pointer', background: over ? C.tealLight : 'transparent', transition: 'background .15s', marginBottom: 22 }}>
        <div style={{ color: C.teal, marginBottom: 8, display: 'flex', justifyContent: 'center' }}><Icon ic={Ic.plus} size={18} /></div>
        <div style={{ fontFamily: BODY, fontWeight: 700, fontSize: 14, color: C.ink }}>Drop images here</div>
        <div style={{ fontFamily: BODY, fontSize: 12, color: C.ink4, marginTop: 3 }}>or click to browse — JPG, PNG, WebP</div>
        <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={e => { readFiles(e.target.files); e.target.value = ''; }} />
      </div>

      {refs.length > 0 && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 16, flexWrap: 'wrap' }}>
          {['All', ...REF_TAGS].map(t => {
            const on = filter === t;
            const count = t === 'All' ? refs.length : refs.filter(r => r.tag === t).length;
            return (
              <button key={t} onClick={() => setFilter(t)}
                style={{ height: 28, padding: '0 12px', borderRadius: 20, border: `1px solid ${on ? C.border : 'transparent'}`, background: on ? C.cardBg : 'transparent', boxShadow: on ? '0 1px 4px rgba(0,0,0,.07)' : 'none', fontFamily: BODY, fontSize: 12, fontWeight: on ? 600 : 400, color: on ? C.ink : C.ink3, cursor: 'pointer' }}>
                {t} <span style={{ fontFamily: MONO, fontSize: 9, color: C.ink4 }}>{count}</span>
              </button>
            );
          })}
        </div>
      )}

      {refs.length === 0 ? (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 14 }}>
          {[0, 1, 2, 3].map(i => (
            <div key={i} style={{ aspectRatio: i % 2 ? '3 / 4' : '4 / 5', border: `1px dashed ${C.borderMd}`, borderRadius: 4, display: 'flex', alignItems: 'flex-end', padding: 10 }}>
              <span style={{ fontFamily: MONO, fontSize: 9, color: C.ink4, letterSpacing: '.06em' }}>FR {pad(i + 1)}</span>
            </div>
          ))}
        </div>
      ) : (
        <div style={{ columnCount: 3, columnGap: 16 }}>
          {shown.map(r => (
            <RefFrame key={r.id} r={r} i={refs.indexOf(r)} onCaption={c => update(r.id, { caption: c })} onTag={() => cycleTag(r)} onRemove={() => setRefs(refs.filter(x => x.id !== r.id))} />
          ))}
        </div>
      )}
    </div>
  );
}

/* ─── MODULE: SHOT PLAN (step 8) ─────────────────────────────── */
function ShotPlanModule({ shots, setShots }) {
  const add = () => setShots([...shots, { id: uid(), scene: '', location: '', cast: '', setup: '', mins: '', status: 0 }]);
  const upd = (id, k, v) => setShots(shots.map(s => s.id === id ? { ...s, [k]: v } : s));
  const move = (i, dir) => {
    const j = i + dir; if (j < 0 || j >= shots.length) return;
    const next = [...shots]; [next[i], next[j]] = [next[j], next[i]]; setShots(next);
  };
  const runtime = shots.reduce((a, s) => a + (Number(s.mins) || 0), 0);
  const locations = new Set(shots.map(s => s.location.trim()).filter(Boolean)).size;
  const counts = SHOT_STATUS.map((_, k) => shots.filter(s => s.status === k).length);
  const arrowBtn = { background: 'none', border: 'none', cursor: 'pointer', color: C.ink4, padding: '2px 3px', display: 'flex' };

  return (
    <div>
      <div style={{ overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', background: C.cardBg, minWidth: 820 }}>
          <thead><tr>
            <th style={{ ...th, width: 64 }}>Shot</th><th style={th}>Scene</th><th style={th}>Location</th>
            <th style={th}>Cast</th><th style={th}>Setup</th><th style={{ ...th, width: 74, textAlign: 'right' }}>Mins</th>
            <th style={{ ...th, width: 104 }}>Status</th><th style={{ ...th, width: 36 }} />
          </tr></thead>
          <tbody>
            {shots.length === 0 && (
              <tr><td colSpan={8} style={{ ...td, padding: '18px 12px', fontFamily: BODY, fontSize: 12.5, color: C.ink4 }}>No shots yet. Add the first frame — order here becomes the order of the day.</td></tr>
            )}
            {shots.map((s, i) => {
              const st = SHOT_STATUS[s.status];
              return (
                <tr key={s.id}>
                  <td style={{ ...td, padding: '0 4px 0 10px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                      <span style={{ fontFamily: MONO, fontSize: 11, color: C.ink2, width: 22 }}>{pad(i + 1)}</span>
                      <button title="Move up" onClick={() => move(i, -1)} style={arrowBtn}><Icon ic={Ic.chevDown} size={10} style={{ transform: 'rotate(180deg)' }} /></button>
                      <button title="Move down" onClick={() => move(i, 1)} style={arrowBtn}><Icon ic={Ic.chevDown} size={10} /></button>
                    </div>
                  </td>
                  <td style={td}><CellInput value={s.scene} onChange={v => upd(s.id, 'scene', v)} placeholder="Look 01 — opening" /></td>
                  <td style={td}><CellInput value={s.location} onChange={v => upd(s.id, 'location', v)} placeholder="Studio A" /></td>
                  <td style={td}><CellInput value={s.cast} onChange={v => upd(s.id, 'cast', v)} placeholder="Talent" /></td>
                  <td style={td}><CellInput value={s.setup} onChange={v => upd(s.id, 'setup', v)} placeholder="85mm, window light" /></td>
                  <td style={td}><CellInput type="number" mono align="right" value={s.mins} onChange={v => upd(s.id, 'mins', v)} placeholder="30" /></td>
                  <td style={{ ...td, padding: '0 8px' }}>
                    <button onClick={() => upd(s.id, 'status', (s.status + 1) % SHOT_STATUS.length)} title="Change status" style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer' }}>
                      <Chip small label={st.label} color={st.color} />
                    </button>
                  </td>
                  <td style={{ ...td, textAlign: 'center' }}>
                    <button onClick={() => setShots(shots.filter(x => x.id !== s.id))} title="Remove" style={{ background: 'none', border: 'none', color: C.ink4, cursor: 'pointer', padding: 8 }}><Icon ic={Ic.close} size={10} /></button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 12, gap: 12, flexWrap: 'wrap' }}>
        <Btn small icon={Ic.plus} onClick={add}>Add shot</Btn>
        <div style={{ display: 'flex', gap: 22, fontFamily: MONO, fontSize: 10.5, color: C.ink3, letterSpacing: '.04em' }}>
          <span>SHOTS <b style={{ color: C.ink }}>{pad(shots.length)}</b></span>
          <span>LOCATIONS <b style={{ color: C.ink }}>{pad(locations)}</b></span>
          <span>RUNTIME <b style={{ color: C.ink }}>{fmtDur(runtime)}</b></span>
          <span>READY <b style={{ color: C.teal }}>{counts[1]}</b> · SHOT <b style={{ color: C.ink }}>{counts[2]}</b></span>
        </div>
      </div>
    </div>
  );
}

/* ─── MODULE: CALLSHEET (step 9) ─────────────────────────────── */
function CallsheetModule({ data, setData, goTo }) {
  const cs = data.callsheet;
  const set = k => v => setData('callsheet', { ...cs, [k]: v });
  const location = cs.location || data.shots.find(s => s.location.trim())?.location || '—';
  const callMin = toMin(cs.callTime);
  let t = callMin + (Number(cs.setupMins) || 0);
  const schedule = data.shots.map(s => { const at = t; t += Number(s.mins) || 0; return { ...s, at }; });
  const wrap = t;
  const dateLabel = cs.date
    ? new Date(cs.date + 'T00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
    : 'Date to be confirmed';
  const cell = { padding: '8px 10px', borderBottom: `1px solid ${C.border}`, fontFamily: BODY, fontSize: 12.5, color: C.ink2, verticalAlign: 'top' };
  const head = { ...cell, fontFamily: MONO, fontSize: 9, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: C.ink4, borderBottom: `1.5px solid ${C.ink}` };

  return (
    <div>
      {/* Controls */}
      <div className="no-print" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 14, marginBottom: 14 }}>
        <Field type="date" label="Shoot date" value={cs.date} onChange={set('date')} />
        <Field type="time" label="General call" value={cs.callTime} onChange={set('callTime')} />
        <Field label="Base location" value={cs.location} onChange={set('location')} placeholder={location !== '—' ? location : 'From shot plan'} />
        <Field type="number" label="Setup before first shot (mins)" value={cs.setupMins} onChange={set('setupMins')} />
        <Field span multiline rows={2} label="Notes for the day" value={cs.notes} onChange={set('notes')} placeholder="Parking, catering, nearest hospital, weather call…" />
      </div>
      <div className="no-print" style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginBottom: 22 }}>
        <Btn small icon={Ic.arrow} onClick={() => goTo(8)}>Edit shot plan</Btn>
        <Btn small icon={Ic.arrow} onClick={() => goTo(7)}>Edit team</Btn>
        <Btn variant="primary" icon={Ic.download} onClick={() => window.print()}>Export</Btn>
      </div>

/* ─── MAP VIEW ───────────────────────────────────────────────── */
const MAP = { nodeW: 220, nodeH: 76, subW: 276, pad: 30, gap: 18, top: 92, rowGap: 128, margin: 24, bottom: 92 };

function layoutMap(template) {
  const rows = Math.max(...template.steps.map(s => s.map.row)) + 1;
  const H = MAP.top + (rows - 1) * MAP.rowGap + MAP.nodeH + MAP.bottom;
  const pos = {}, bands = [];
  let x = MAP.margin;
  template.stages.forEach((name, i) => {
    const steps = template.steps.filter(s => s.phase === name);
    const subs = Math.max(...steps.map(s => s.map.sub)) + 1;
    const w = MAP.pad * 2 + (subs - 1) * MAP.subW + MAP.nodeW;
    bands.push({ name, steps, x, w, i });
    steps.forEach(s => { pos[s.n] = { x: x + MAP.pad + s.map.sub * MAP.subW, y: MAP.top + s.map.row * MAP.rowGap }; });
    x += w + MAP.gap;
  });
  return { pos, bands, W: x - MAP.gap + MAP.margin, H };
}

const stepStatus = (step, completed) =>
  completed.includes(step.n) ? 'done' : step.requires.every(r => completed.includes(r)) ? 'available' : 'waiting';

const ancestorsOf = (n, steps, acc = new Set()) => {
  steps[n - 1].requires.forEach(r => { if (!acc.has(r)) { acc.add(r); ancestorsOf(r, steps, acc); } });
  return acc;
};

/* Orthogonal connector with soft corners; it bends in the gutter just before the target card */
const edgePath = (x1, y1, x2, y2) => {
  if (Math.abs(y2 - y1) < 1) return `M${x1},${y1} H${x2}`;
  const xm = x2 - 30, r = Math.min(10, Math.abs(y2 - y1) / 2), d = y2 > y1 ? 1 : -1;
  return `M${x1},${y1} H${xm - r} Q${xm},${y1} ${xm},${y1 + d * r} V${y2 - d * r} Q${xm},${y2} ${xm + r},${y2} H${x2}`;
};

/* What a card shows under its name: live progress once work exists, otherwise what the step delivers */
function stepMeta(step, d) {
  const live = text => ({ text, live: true });
  const idle = { text: step.delivers, live: false };
  switch (step.n) {
    case 1: return d.vision.statement.trim() ? live(d.vision.keywords.length ? `Direction set · ${d.vision.keywords.length} keywords` : 'Direction set') : idle;
    case 2: { const k = Object.values(d.concept).filter(v => String(v).trim()).length; return k ? live(`${k} / 5 fields`) : idle; }
    case 3: return d.references.length ? live(`${d.references.length} frame${d.references.length === 1 ? '' : 's'}`) : idle;
    case 7: return d.team.length ? live(`${d.team.length} crew`) : idle;
    case 8: { const m = d.shots.reduce((a, s) => a + (Number(s.mins) || 0), 0); return d.shots.length ? live(`${d.shots.length} shot${d.shots.length === 1 ? '' : 's'} · ${fmtDur(m)}`) : idle; }
    case 9: return d.shots.length ? live(`Call ${d.callsheet.callTime}${d.callsheet.date ? ' · ' + d.callsheet.date : ''}`) : idle;
    default: return (d.notes[step.n] || '').trim() ? live('Notes started') : idle;
  }
}

/* 35mm frame: sprocket holes + frame number, or the lead image once one exists */
function FilmTile({ n, img }) {
  const holes = side => (

    </div>

  return (
    <div style={{ position: 'relative', width: 52, height: 52, flexShrink: 0, borderRadius: 10, overflow: 'hidden', background: img ? `#111 center/cover url("${img}")` : C.pageBg, border: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      {holes('top')}{holes('bottom')}
      {!img && <span style={{ fontFamily: MONO, fontSize: 13, fontWeight: 600, color: C.ink2, letterSpacing: '.04em' }}>{pad(n)}</span>}

}

  return (
    <div data-node="" onClick={onOpen}
      onMouseEnter={() => { setH(true); onHover(step.n); }} onMouseLeave={() => { setH(false); onHover(null); }}
      style={{ position: 'absolute', left: p.x, top: p.y, width: MAP.nodeW, height: MAP.nodeH, animation: `nodeIn .32s ease ${delay}s both` }}>
      <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', gap: 12, padding: '0 14px 0 12px', background: C.cardBg, borderRadius: 14,
        border: `1.5px solid ${active ? C.teal : h ? C.borderMd : C.border}`,
        boxShadow: active ? `0 0 0 4px ${C.tealSoft}, 0 10px 28px rgba(15,14,12,.08)` : h ? '0 8px 22px rgba(15,14,12,.08)' : '0 1px 3px rgba(15,14,12,.04)',
        opacity: waiting && !active && !h ? .5 : 1, transform: h ? 'translateY(-1px)' : 'none', cursor: 'pointer', transition: 'all .16s ease' }}>
        <FilmTile n={step.n} img={img} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontFamily: BODY, fontSize: 14, fontWeight: 600, color: C.ink, letterSpacing: '-.15px', lineHeight: 1.25, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{step.label}</div>
          <div style={{ fontFamily: MONO, fontSize: 9, fontWeight: 600, letterSpacing: '.07em', textTransform: 'uppercase', color: meta.live ? C.teal : C.ink4, marginTop: 5, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{meta.text}</div>
        </div>
        {status === 'done' && (
          <span style={{ width: 20, height: 20, borderRadius: '50%', background: C.teal, color: '#fff', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon ic={Ic.check} size={10} /></span>
        )}
      </div>
      {status === 'available' && (
        <span style={{ position: 'absolute', top: -11, right: 12, display: 'flex', background: C.cardBg, borderRadius: 20 }}><Chip small label="Available" /></span>
      )}
      {waiting && (
        <span title="Waiting on earlier steps" style={{ position: 'absolute', top: -9, right: 12, width: 20, height: 20, borderRadius: 6, background: C.cardBg, border: `1px solid ${C.borderMd}`, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: C.ink4 }}>
          <Icon ic={Ic.lock} size={11} />
        </span>

  );
}

function MapPopover({ step, p, status, steps, completed, flip }) {
  const reqs = step.requires.map(n => steps[n - 1]);
  const statusChip = { done: <Chip small label="Complete" />, available: <Chip small label="Available" />, waiting: <Chip small label="Waiting" color={C.ink3} /> }[status];
  const row = (label, body) => (
    <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', marginTop: 8 }}>
      <span style={{ width: 66, flexShrink: 0, paddingTop: 2 }}><MonoLabel>{label}</MonoLabel></span>
      <div style={{ flex: 1, fontFamily: BODY, fontSize: 12.5, color: C.ink, lineHeight: 1.5 }}>{body}</div>
    </div>
  );
  return (
    <div style={{ position: 'absolute', left: flip ? p.x - 314 : p.x + MAP.nodeW + 14, top: p.y - 8, width: 300, background: C.cardBg, borderRadius: 14, border: `1px solid ${C.border}`, boxShadow: '0 16px 44px rgba(15,14,12,.14)', padding: '16px 18px', zIndex: 30, pointerEvents: 'none', animation: 'popIn .14s ease' }}>
      <div style={{ fontFamily: BODY, fontSize: 15, fontWeight: 700, color: C.ink, letterSpacing: '-.2px' }}>{step.label}</div>
      <div style={{ display: 'flex', gap: 6, marginTop: 8 }}><Chip small label={step.phase} color={C.ink3} />{statusChip}</div>
      <div style={{ height: 1, background: C.border, margin: '13px 0' }} />
      <p style={{ fontFamily: BODY, fontSize: 13, color: C.ink2, lineHeight: 1.6 }}>{step.desc}</p>
      <div style={{ height: 1, background: C.border, margin: '13px 0 5px' }} />
      {row('Requires', reqs.length ? reqs.map(r => {
        const ok = completed.includes(r.n);
        return (
          <div key={r.n} style={{ display: 'flex', alignItems: 'center', gap: 7, color: ok ? C.ink : C.ink3 }}>
            <Icon ic={ok ? Ic.check : Ic.lock} size={11} color={ok ? C.teal : C.ink4} />{r.label}
          </div>
        );
      }) : <span style={{ color: C.ink3 }}>Nothing. Start here.</span>)}
      {row('Delivers', step.delivers)}
      {status === 'waiting' && (
        <div style={{ fontFamily: BODY, fontSize: 11.5, color: C.ink4, marginTop: 12, lineHeight: 1.5 }}>The order is a guide, not a gate. Open it any time.</div>
      )}
    </div>
  );
}

function MapControlBtn({ ic, onClick, title, children }) {
  const [h, setH] = useState(false);
  return (
    <button onClick={onClick} title={title} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ minWidth: 30, height: 30, padding: children ? '0 8px' : 0, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', borderRadius: 8, border: 'none', background: h ? C.tealLight : 'transparent', color: h ? C.teal : C.ink2, cursor: 'pointer', fontFamily: MONO, fontSize: 10.5, fontWeight: 600, transition: 'all .13s' }}>
      {ic ? <Icon ic={ic} size={12} /> : children}
    </button>
  );
}

function MapView({ template, completed, activeStep, panelOpen, projectData, onOpen }) {
  const steps = template.steps;
  const { pos, bands, W, H } = useMemo(() => layoutMap(template), [template]);
  const [hover, setHover] = useState(null);
  const [scale, setScale] = useState(1);
  const scroller = useRef(null);
  const drag = useRef(null);

  const fitScale = el => Math.max(.5, Math.min(1, +((el.clientWidth - 16) / W).toFixed(2)));
  const fit = () => { const el = scroller.current; if (el) setScale(fitScale(el)); };
  // Open legible (≥ 80%); "Fit" shows the whole template.
  useEffect(() => { const el = scroller.current; if (el) setScale(Math.max(.8, fitScale(el))); }, []);
  const zoom = d => setScale(s => Math.max(.5, Math.min(1.3, +(s + d).toFixed(2))));

  // Keep the open step in view once the panel has slid in.
  useEffect(() => {
    if (!panelOpen) return;
    const el = scroller.current, p = pos[activeStep];
    if (!el || !p) return;
    const t = setTimeout(() => el.scrollTo({ left: (p.x + MAP.nodeW / 2) * scale - el.clientWidth / 2, top: (p.y + MAP.nodeH / 2) * scale - el.clientHeight / 2, behavior: 'smooth' }), 260);
    return () => clearTimeout(t);
  }, [activeStep, panelOpen]);

  // Drag the background to pan.
  const onDown = e => {
    if (e.button !== 0 || e.target.closest('[data-node]')) return;
    const el = scroller.current;
    drag.current = { x: e.clientX, y: e.clientY, l: el.scrollLeft, t: el.scrollTop };
    el.style.cursor = 'grabbing';
  };
  const onMove = e => {
    const d = drag.current; if (!d) return;
    const el = scroller.current;
    el.scrollLeft = d.l - (e.clientX - d.x); el.scrollTop = d.t - (e.clientY - d.y);
  };
  const onUp = () => { drag.current = null; if (scroller.current) scroller.current.style.cursor = 'grab'; };

  // Hovering (or opening) a step lights up the full chain it depends on.
  const focus = hover ?? (panelOpen ? activeStep : null);
  const chain = focus ? new Set([focus, ...ancestorsOf(focus, steps)]) : new Set();
  const edges = steps.flatMap(s => s.requires.map(r => ({ from: r, to: s.n, hl: chain.has(s.n) && chain.has(r), done: completed.includes(r) })))
    .sort((a, b) => a.hl - b.hl);

  const doneCount = completed.length;
  const next = steps.find(s => stepStatus(s, completed) === 'available');
  const lastBand = bands[bands.length - 1];
  const leadImg = projectData.references[0]?.src;

  return (
    <div style={{ position: 'relative', flex: 1, minWidth: 0, background: C.pageBg }}>
      <div ref={scroller} onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp}
        style={{ position: 'absolute', inset: 0, display: 'flex', overflow: 'auto', cursor: 'grab', userSelect: 'none',
          backgroundImage: 'radial-gradient(rgba(15,14,12,.11) 1px, transparent 1.3px)', backgroundSize: '18px 18px', backgroundAttachment: 'local' }}>
        <div style={{ width: W * scale, height: H * scale, flexShrink: 0, position: 'relative', margin: 'auto' }}>
          <div style={{ position: 'absolute', left: 0, top: 0, width: W, height: H, transform: `scale(${scale})`, transformOrigin: '0 0' }}>
            {/* Stage bands */}
            {bands.map(b => {
              const d = b.steps.filter(s => completed.includes(s.n)).length;
              return (
                <div key={b.name} style={{ position: 'absolute', left: b.x, top: MAP.margin, width: b.w, height: H - MAP.margin * 2, borderRadius: 20, background: b.i % 2 ? 'rgba(255,255,255,.26)' : 'rgba(255,255,255,.55)', border: `1px solid ${C.border}` }}>
                  <div style={{ position: 'absolute', left: 16, bottom: 16, padding: '7px 14px', borderRadius: 20, border: `1px solid ${C.borderMd}`, background: C.pageBg, fontFamily: MONO, fontSize: 10, fontWeight: 600, letterSpacing: '.16em', textTransform: 'uppercase', color: C.ink3 }}>{b.name}</div>
                  <div style={{ position: 'absolute', right: 18, bottom: 24, fontFamily: MONO, fontSize: 10, fontWeight: 600, letterSpacing: '.08em', color: d === b.steps.length ? C.teal : C.ink4 }}>{pad(d)}/{pad(b.steps.length)}</div>
                </div>
              );
            })}

            {/* Connectors */}
            <svg width={W} height={H} style={{ position: 'absolute', left: 0, top: 0, pointerEvents: 'none', overflow: 'visible' }}>
              {edges.map(e => {
                const a = pos[e.from], b = pos[e.to];
                return (
                  <path key={e.from + '-' + e.to} d={edgePath(a.x + MAP.nodeW, a.y + MAP.nodeH / 2, b.x, b.y + MAP.nodeH / 2)} fill="none"
                    stroke={e.hl ? C.teal : e.done ? 'rgba(15,14,12,.32)' : 'rgba(15,14,12,.2)'}
                    strokeWidth={e.hl ? 2 : 1.25} strokeDasharray={e.hl || e.done ? 'none' : '4 4'} style={{ transition: 'stroke .18s' }} />
                );
              })}
              {steps.filter(s => s.requires.length).map(s => {
                const p = pos[s.n], lit = chain.has(s.n);
                return <circle key={s.n} cx={p.x} cy={p.y + MAP.nodeH / 2} r={3.5} fill={lit ? C.teal : C.cardBg} stroke={lit ? C.teal : 'rgba(15,14,12,.3)'} strokeWidth={1.25} />;
              })}
            </svg>

            {/* Step cards */}
            {steps.map((s, i) => (
              <MapNode key={s.n} step={s} p={pos[s.n]} status={stepStatus(s, completed)} active={panelOpen && s.n === activeStep}
                meta={stepMeta(s, projectData)} img={s.n === 3 ? leadImg : null} delay={i * .025}
                onOpen={() => onOpen(s.n)} onHover={setHover} />
            ))}

            {hover && (
              <MapPopover step={steps[hover - 1]} p={pos[hover]} status={stepStatus(steps[hover - 1], completed)} steps={steps} completed={completed}
                flip={pos[hover].x + MAP.nodeW + 330 > W || pos[hover].x >= lastBand.x} />
            )}
          </div>
        </div>
      </div>

      {/* Template card */}
      <div className="no-print" style={{ position: 'absolute', left: 18, bottom: 18, width: 252, background: C.cardBg, border: `1px solid ${C.border}`, borderRadius: 14, padding: '14px 16px', boxShadow: '0 6px 22px rgba(15,14,12,.06)' }}>
        <MonoLabel color={C.teal} style={{ marginBottom: 6 }}>Template · {template.stage}</MonoLabel>
        <div style={{ fontFamily: BODY, fontSize: 15, fontWeight: 700, color: C.ink, letterSpacing: '-.2px' }}>{template.name}</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, margin: '10px 0 12px' }}>
          <div style={{ flex: 1, height: 3, background: C.border, borderRadius: 2, overflow: 'hidden' }}>
            <div style={{ width: `${(doneCount / steps.length) * 100}%`, height: '100%', background: C.teal, transition: 'width .3s ease' }} />
          </div>
          <MonoLabel color={C.ink3}>{pad(doneCount)}/{pad(steps.length)}</MonoLabel>
        </div>
        {next
          ? <button onClick={() => onOpen(next.n)}
              style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, padding: '9px 12px', borderRadius: 10, border: `1px solid ${C.border}`, background: C.pageBg, cursor: 'pointer', transition: 'all .13s', textAlign: 'left' }}
              onMouseEnter={e => { e.currentTarget.style.background = C.tealLight; e.currentTarget.style.borderColor = C.teal; }}
              onMouseLeave={e => { e.currentTarget.style.background = C.pageBg; e.currentTarget.style.borderColor = C.border; }}>
              <span>
                <MonoLabel style={{ marginBottom: 2 }}>Next up</MonoLabel>
                <span style={{ fontFamily: BODY, fontSize: 13, fontWeight: 600, color: C.ink }}>{next.label}</span>
              </span>
              <Icon ic={Ic.arrow} size={11} color={C.teal} />
            </button>
          : <div style={{ fontFamily: BODY, fontSize: 13, color: C.teal, fontWeight: 600 }}>Every step is complete.</div>}
      </div>

      {/* Zoom controls */}
      <div className="no-print" style={{ position: 'absolute', right: 18, bottom: 18, display: 'flex', alignItems: 'center', gap: 2, padding: 3, background: C.cardBg, border: `1px solid ${C.border}`, borderRadius: 11, boxShadow: '0 4px 16px rgba(15,14,12,.06)' }}>
        <MapControlBtn ic={Ic.minus} title="Zoom out" onClick={() => zoom(-.1)} />
        <MapControlBtn title="Reset to 100%" onClick={() => setScale(1)}>{Math.round(scale * 100)}%</MapControlBtn>
        <MapControlBtn ic={Ic.plus} title="Zoom in" onClick={() => zoom(.1)} />
        <div style={{ width: 1, height: 16, background: C.border, margin: '0 3px' }} />
        <MapControlBtn ic={Ic.fit} title="Fit to screen" onClick={fit} />
      </div>
    </div>
  );
}

/* ─── VIEW TOGGLE (Map / List) ───────────────────────────────── */
function ViewToggle({ view, setView }) {
  const opts = [{ id: 'map', label: 'Map', ic: Ic.mapView }, { id: 'list', label: 'List', ic: Ic.listView }];
  return (
    <div role="tablist" style={{ display: 'inline-flex', padding: 3, background: C.pageBg, border: `1px solid ${C.border}`, borderRadius: 20 }}>
      {opts.map(o => {
        const on = view === o.id;
        return (
          <button key={o.id} role="tab" aria-selected={on} onClick={() => setView(o.id)} title={`${o.label} view`}
            onMouseEnter={e => { if (!on) e.currentTarget.style.color = C.ink; }} onMouseLeave={e => { if (!on) e.currentTarget.style.color = C.ink3; }}
            style={{ display: 'inline-flex', alignItems: 'center', gap: 6, height: 26, padding: '0 12px', borderRadius: 16, border: 'none', background: on ? C.cardBg : 'transparent', boxShadow: on ? '0 1px 3px rgba(15,14,12,.1)' : 'none', color: on ? C.ink : C.ink3, fontFamily: BODY, fontSize: 12, fontWeight: on ? 600 : 500, cursor: 'pointer', transition: 'all .13s' }}>
            <Icon ic={o.ic} size={13} />{o.label}
          </button>
        );
      })}
    </div>
  );
}

/* ─── STEP BODY (shared by list view and the map's side panel) ─ */
function StepBody({ step, total, isDone, compact, module, goTo, toggleComplete, completeAndNext }) {
  const n = step.n;
  return (
    <>
      <div className="no-print">
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <MonoLabel color={C.teal}>Step {pad(n)} / {total} · {step.phase}</MonoLabel>
          {isDone && <Chip small label="Complete" />}
        </div>
        <h1 style={{ fontFamily: BODY, fontWeight: 800, fontSize: compact ? 25 : 30, letterSpacing: compact ? '-.6px' : '-.8px', color: C.ink, margin: '8px 0 6px' }}>{step.label}</h1>
        <p style={{ fontFamily: BODY, fontSize: compact ? 13.5 : 14, color: C.ink3, lineHeight: 1.6 }}>{step.desc}</p>
        <div style={{ height: 1.5, background: C.ink, margin: compact ? '18px 0 22px' : '20px 0 26px' }} />
      </div>

      {module}

      <div className="no-print">
        <Divider />
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
          <Btn icon={Ic.chevLeft} disabled={n === 1} onClick={() => goTo(n - 1)}>Previous</Btn>
          <div style={{ display: 'flex', gap: 8 }}>
            {isDone && <Btn onClick={toggleComplete}>Mark incomplete</Btn>}
            {n < total
              ? <Btn variant="primary" icon={Ic.check} onClick={completeAndNext}>{isDone ? 'Continue' : 'Mark complete & continue'}</Btn>
              : !isDone && <Btn variant="primary" icon={Ic.check} onClick={toggleComplete}>Mark complete</Btn>}
          </div>
        </div>
      </div>
    </>
  );
}

/* ─── CATALOGUE (from templates.manifest.json) ───────────────── */
const toneFor = (family, variant) => {
  const f = FAMILIES[family] || FAMILIES.production;
  const pos = { a: '30% 26%', b: '50% 28%', c: '70% 26%' }[variant] || '50% 28%';
  return `radial-gradient(120% 95% at ${pos}, ${f.light} 0%, ${f.core} 40%, ${f.deep} 100%)`;
};
const CATALOG = CATALOG_DATA.map(d => d.code === 'T01'
  ? { ...d, ...CD_TEMPLATE, status: 'live' }
  : { ...d, id: d.code.toLowerCase(), tone: toneFor(d.family, d.variant) });
const FAMILY_ORDER = ['production', 'creator', 'camera', 'post', 'photo', 'craft', 'enterprise', 'performance'];
const STAGES_ALL = ['Pre-production', 'Production', 'Post-production'];

/* ─── SEARCH: plain-language matching with reasons ───────────────
   Each word the user types is expanded with everyday synonyms, then scored
   against name > keywords > roles > stage/family > description. */
const STOPWORDS = new Set('a an the for my our i im i\'m we need to of in on at with and or want make making plan planning planned template templates next week some help me do doing new something'.split(' '));
const SYNONYMS = {
  photoshoot: ['shoot', 'editorial', 'photo'], shoot: ['shoot', 'call sheet', 'shot list'], fashion: ['editorial', 'fashion', 'pull', 'stylist', 'wardrobe'],
  lookbook: ['editorial', 'lookbook'], magazine: ['editorial'], campaign: ['campaign', 'editorial', 'brand', 'social'], ad: ['av script', 'commercial'], commercial: ['av script', 'commercial'],
  money: ['budget', 'invoice'], cost: ['budget'], costs: ['budget'], spend: ['budget'], pay: ['invoice'], paid: ['invoice'], bill: ['invoice'],
  crew: ['crew', 'call sheet'], team: ['crew'], schedule: ['call sheet', 'schedule', 'calendar'], permit: ['filming notice'], permits: ['filming notice'], location: ['filming notice', 'location'],
  cast: ['casting'], model: ['casting'], models: ['casting'], actors: ['casting'], talent: ['casting', 'talent'],
  film: ['shot list', 'storyboard', 'script'], movie: ['script', 'storyboard'], video: ['shot list', 'storyboard', 'av script'], music: ['music', 'cue sheet'], song: ['music'],
  tiktok: ['tiktok', 'grwm', 'creator'], reels: ['reels', 'tiktok'], instagram: ['instagram', 'social'], youtube: ['youtube', 'tutorial', 'explainer'], vlog: ['day in my life'],
  makeup: ['makeup', 'grwm'], beauty: ['beauty', 'makeup'], gear: ['equipment', 'camera'], lights: ['lighting'], edit: ['edit', 'contact sheet'], colour: ['color'],
  sound: ['sound', 'audio'], press: ['press'], pr: ['press', 'publicity'], legal: ['legal', 'contract'], wedding: ['event'], unboxing: ['unboxing', 'haul'], brand: ['brand'],
  script: ['script'], story: ['storytime', 'storyboard'], photo: ['photo', 'editorial'], photographer: ['photo', 'editorial'], stylist: ['stylist', 'pull', 'editorial'], styling: ['stylist', 'pull', 'wardrobe'],
};
function rankTemplates(query, list) {
  const words = query.toLowerCase().replace(/[^a-z0-9\s'-]/g, ' ').split(/\s+/).filter(w => w.length >= 2 && !STOPWORDS.has(w));
  if (!words.length) return [];
  return list.map(t => {
    const words_ = str => str.toLowerCase().split(/[^a-z0-9']+/).filter(Boolean);
    const name = t.name.toLowerCase(), kw = t.keywords.join(' | ').toLowerCase(), roles = t.icps.join(' | ').toLowerCase();
    const nameW = words_(t.name), kwW = words_(t.keywords.join(' ')), roleW = words_(t.icps.join(' '));
    const metaW = words_(t.stage + ' ' + (FAMILY_LABELS[t.family] || '')), descW = words_((t.preview || '') + ' ' + t.object);
    // Matches start at a word boundary ("line" finds "Line Producer", not "guideline"); phrases match whole.
    const hit = (ws, str, term) => term.includes(' ') ? str.includes(term) : ws.some(w => w.startsWith(term));
    const termScore = term => {
      if (hit(nameW, name, term)) return 12;
      if (hit(kwW, kw, term)) return 6;
      if (hit(roleW, roles, term)) return 5;
      if (hit(metaW, '', term)) return 3;
      if (term.length > 3 && hit(descW, '', term)) return 2;
      return 0;
    };
    let score = 0; const matched = [];
    words.forEach(w => {
      const base = w.length > 3 && w.endsWith('s') ? w.slice(0, -1) : w;
      let best = Math.max(termScore(w), termScore(base));
      (SYNONYMS[w] || SYNONYMS[base] || []).forEach(s => { best = Math.max(best, termScore(s) * .8); });
      if (best > 0) { score += best; matched.push(w); }
    });
    if (score > 0) score += { live: 3, designed: 1, gap: 0 }[t.status] + (matched.length === words.length ? score * .2 : 0);
    return { t, score, matched, of: words.length };
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);
}

/* ─── SEARCH BOX WITH SUGGESTIONS ────────────────────────────── */
function TemplateSearch({ catalog, query, setQuery, onCommit, onUse }) {
  const [focus, setFocus] = useState(false);
  const [idx, setIdx] = useState(0);
  const results = useMemo(() => rankTemplates(query, catalog).slice(0, 5), [query, catalog]);
  const showDrop = focus && query.trim().length > 1;
  useEffect(() => { setIdx(0); }, [query]);

  const onKey = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setIdx(i => Math.min(results.length, i + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setIdx(i => Math.max(0, i - 1)); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (idx < results.length && results[idx]) { onUse(results[idx].t); setFocus(false); e.currentTarget.blur(); }
      else { onCommit(query); setFocus(false); e.currentTarget.blur(); }
    }
    else if (e.key === 'Escape') { setFocus(false); e.currentTarget.blur(); }
  };

  return (
    <div style={{ position: 'relative', width: '100%', maxWidth: 760 }}>
      <label htmlFor="tpl-search" style={{ position: 'absolute', width: 1, height: 1, overflow: 'hidden', clip: 'rect(0 0 0 0)' }}>Search templates</label>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, height: 56, padding: '0 16px 0 18px', background: C.cardBg, borderRadius: 16, border: `1.5px solid ${focus ? C.teal : C.borderMd}`, boxShadow: focus ? `0 0 0 4px ${C.tealSoft}, 0 10px 30px rgba(15,14,12,.08)` : '0 2px 10px rgba(15,14,12,.04)', transition: 'all .15s' }}>
        <Icon ic={Ic.search} size={18} color={focus ? C.teal : C.ink3} />
        <input id="tpl-search" value={query} onChange={e => setQuery(e.target.value)} onKeyDown={onKey}
          onFocus={() => setFocus(true)} onBlur={() => setTimeout(() => setFocus(false), 120)} autoComplete="off"
          role="combobox" aria-expanded={showDrop} aria-controls="tpl-suggest"
          placeholder="What are you making? Try “fashion editorial”, “permit” or “stylist”"
          style={{ flex: 1, minWidth: 0, border: 'none', outline: 'none', background: 'transparent', fontFamily: BODY, fontSize: 15.5, color: C.ink }} />
        {query && (
          <button onClick={() => { setQuery(''); onCommit(''); }} aria-label="Clear search"
            style={{ width: 28, height: 28, borderRadius: '50%', border: 'none', background: C.pageBg, color: C.ink3, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon ic={Ic.close} size={10} />
          </button>
        )}
      </div>

      {showDrop && (
        <div id="tpl-suggest" role="listbox" style={{ position: 'absolute', left: 0, right: 0, top: 64, zIndex: 50, background: C.cardBg, borderRadius: 16, border: `1px solid ${C.border}`, boxShadow: '0 22px 54px rgba(15,14,12,.16)', padding: 8, animation: 'popIn .14s ease' }}>
          {results.length === 0 && (
            <div style={{ padding: '14px 12px', fontFamily: BODY, fontSize: 13.5, color: C.ink3, lineHeight: 1.55 }}>
              No template matches that yet. Try a role (“line producer”), a deliverable (“call sheet”) or what you’re shooting (“music video”).
            </div>
          )}
          {results.map((r, i) => {
            const on = i === idx;
            return (
              <button key={r.t.code} role="option" aria-selected={on} onMouseDown={e => e.preventDefault()} onClick={() => { onUse(r.t); setFocus(false); }} onMouseEnter={() => setIdx(i)}
                style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 12, padding: '9px 10px', borderRadius: 11, border: 'none', background: on ? C.tealLight : 'transparent', cursor: 'pointer', textAlign: 'left' }}>
                <GlyphTile t={r.t} size={40} radius={10} />
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ fontFamily: BODY, fontSize: 14, fontWeight: 600, color: C.ink }}>{r.t.name}</span>
                    {i === 0 && <Chip small label="Best match" />}
                    {r.t.status === 'gap' && <Chip small label="In design" color={C.ink3} />}
                  </span>
                  <span style={{ display: 'block', fontFamily: BODY, fontSize: 12, color: C.ink3, marginTop: 2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                    {r.t.stage} · for {r.t.icps.slice(0, 2).join(', ')}
                  </span>
                </span>
                <span style={{ fontFamily: MONO, fontSize: 9, fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase', color: C.teal, flexShrink: 0 }}>{r.matched.join(' · ')}</span>
              </button>
            );
          })}
          <button onMouseDown={e => e.preventDefault()} onClick={() => { onCommit(query); setFocus(false); }} onMouseEnter={() => setIdx(results.length)}
            style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 4, padding: '10px 12px', borderRadius: 11, border: 'none', borderTop: `1px solid ${C.border}`, background: idx === results.length ? C.pageBg : 'transparent', cursor: 'pointer', fontFamily: BODY, fontSize: 13, color: C.ink2 }}>
            <span>See all results for “{query.trim()}”</span>
            <span style={{ fontFamily: MONO, fontSize: 10, color: C.ink4 }}>ENTER ↵</span>
          </button>
        </div>
      )}
    </div>
  );
}

            <div>
              <MonoLabel color={C.teal} style={{ marginBottom: 8 }}>Templates</MonoLabel>
              <h1 style={{ fontFamily: BODY, fontWeight: 800, fontSize: 36, letterSpacing: '-1.1px', color: C.ink, lineHeight: 1.05 }}>Start from a proven path</h1>
            </div>
            <TemplateSearch catalog={catalog} query={query} setQuery={setQuery} onCommit={q => setCommitted(q.trim())} onUse={use} />
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 14, flexWrap: 'wrap' }}>
              <StageChips stage={stage} setStage={setStage} catalog={catalog} />
              {!results && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  {view === 'showcase' && <>
                    <Btn small icon={Ic.chevLeft} onClick={() => nudge(-1)} title="Previous" />
                    <Btn small icon={Ic.chevRight} onClick={() => nudge(1)} title="Next" />
                  </>}
                  <GalleryToggle view={view} setView={setView} />
                </div>
              )}
            </div>
          </div>

          {/* Search results */}
          {results && (
            <div style={{ padding: '30px 44px 0' }}>
              <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 12, marginBottom: 18 }}>
                <SectionLabel sub={!results.length ? 'Nothing matches yet.'
                  : results[0].matched.length < results[0].of ? `No template covers everything you typed yet. These are the closest ${results.length}.`
                  : `${results.length} template${results.length === 1 ? '' : 's'} match${results.length === 1 ? 'es' : ''}${stage !== 'All' ? ' in ' + stage.toLowerCase() : ''}.`}>Results for “{committed}”</SectionLabel>
                <Btn small icon={Ic.close} onClick={() => { setCommitted(''); setQuery(''); }}>Clear</Btn>
              </div>
              {results.length > 0 ? (
                <div style={{ display: 'flex', gap: 28, alignItems: 'flex-start', flexWrap: 'wrap' }}>
                  <div style={{ flex: '1 1 460px', maxWidth: 560 }}>
                    <TemplateCard t={results[0].t} onUse={use} width="100%" badge="Best match" />
                    <div style={{ fontFamily: BODY, fontSize: 12.5, color: C.ink3, marginTop: 12 }}>Matched on <span style={{ fontFamily: MONO, fontSize: 10.5, color: C.teal, textTransform: 'uppercase', letterSpacing: '.06em' }}>{results[0].matched.join(' · ')}</span></div>
                  </div>
                  {results.length > 1 && (
                    <div style={{ flex: '1 1 360px', minWidth: 0 }}>
                      <MonoLabel style={{ marginBottom: 12 }}>Also relevant</MonoLabel>
                      <div style={compactGrid}>{results.slice(1, 13).map(r => <CompactTile key={r.t.code} t={r.t} onUse={use} />)}</div>
                    </div>
                  )}
                </div>
              ) : (
                <div style={{ padding: '26px 24px', borderRadius: 16, border: `1px dashed ${C.borderMd}`, fontFamily: BODY, fontSize: 14, color: C.ink3, lineHeight: 1.6, maxWidth: 640 }}>
                  No template covers that yet. Try a role (“line producer”), a deliverable (“call sheet”) or what you’re shooting (“music video”).
                </div>
              )}
            </div>
          )}

          {/* Showcase view */}
          {!results && view === 'showcase' && (
            <>
              <div ref={row} className="hide-scroll" style={{ display: 'flex', gap: 24, overflowX: 'auto', scrollSnapType: 'x mandatory', scrollPaddingLeft: 44, padding: '28px 44px 52px', marginBottom: -18 }}>
                {featured.map(t => <TemplateCard key={t.code} t={t} onUse={use} />)}
                <div style={{ width: 20, flexShrink: 0 }} />
              </div>
              {inDesign.length > 0 && (
                <div style={{ padding: '0 44px' }}>
                  <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 12 }}>
                    <SectionLabel sub="What we're building next.">{inDesign.length} in design</SectionLabel>
                    <Btn small icon={Ic.gridView} onClick={() => setView('compact')}>See all in compact view</Btn>
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                    {inDesign.map(t => (
                      <span key={t.code} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, height: 32, padding: '0 12px 0 6px', borderRadius: 20, background: C.cardBg, border: `1px solid ${C.border}`, fontFamily: BODY, fontSize: 12.5, color: C.ink3 }}>
                        <GlyphTile t={t} size={22} radius={11} />{t.name}
                      </span>
                    ))}
                  </div>
                </div>
              )}
            </>
          )}

          {/* Compact view: small cards with icons, one shelf per family */}
          {!results && view === 'compact' && (
            <div style={{ padding: '30px 44px 0', display: 'flex', flexDirection: 'column', gap: 34 }}>
              {FAMILY_ORDER.map(fam => {
                const items = visible.filter(t => t.family === fam);
                if (!items.length) return null;
                return (
                  <section key={fam}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
                      <span style={{ width: 10, height: 10, borderRadius: 3, background: FAMILIES[fam].core }} />
                      <h2 style={{ fontFamily: BODY, fontSize: 17, fontWeight: 800, letterSpacing: '-.3px', color: C.ink }}>{FAMILY_LABELS[fam]}</h2>
                      <MonoLabel color={C.ink4}>{items.length}</MonoLabel>
                    </div>
                    <div style={compactGrid}>{items.map(t => <CompactTile key={t.code} t={t} onUse={use} />)}</div>
                  </section>
                );
              })}
            </div>
          )}
        </div>
      </div>
      <Toast msg={toast} />
    </div>
  );
}

/* ─── WORKSPACE SHELL ────────────────────────────────────────── */
function ProjectWorkspace({ template, projectName, task, onExit }) {
  const steps = template.steps, total = steps.length;
  const [state, setState] = useState({ activeStep: 1, completed: [], projectData: initialProjectData(projectName, task) });
  const [view, setView] = useState('map');
  const [panelOpen, setPanelOpen] = useState(false);
  const { activeStep, completed, projectData } = state;
  const step = steps[activeStep - 1];
  const isDone = completed.includes(activeStep);

  const setData = (key, value) => setState(s => ({ ...s, projectData: { ...s.projectData, [key]: value } }));
  const goTo = n => setState(s => ({ ...s, activeStep: n }));
  const openStep = n => { goTo(n); setPanelOpen(true); };
  const toggleComplete = () => setState(s => ({ ...s, completed: s.completed.includes(s.activeStep) ? s.completed.filter(x => x !== s.activeStep) : [...s.completed, s.activeStep] }));
  const completeAndNext = () => setState(s => ({
    ...s,
    completed: s.completed.includes(s.activeStep) ? s.completed : [...s.completed, s.activeStep],
    activeStep: Math.min(total, s.activeStep + 1),
  }));

  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') setPanelOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const renderModule = () => {
    if (activeStep <= 3) return <BlueprintModule step={activeStep} data={projectData} setData={setData} goTo={goTo} />;
    if (activeStep === 7) return <TeamModule team={projectData.team} setTeam={v => setData('team', v)} />;
    if (activeStep === 8) return <ShotPlanModule shots={projectData.shots} setShots={v => setData('shots', v)} />;
    if (activeStep === 9) return <CallsheetModule data={projectData} setData={setData} goTo={goTo} />;
    return <StepNotes step={step} value={projectData.notes[activeStep]} onChange={v => setData('notes', { ...projectData.notes, [activeStep]: v })} />;
  };
  const body = compact => (
    <StepBody step={step} total={total} isDone={isDone} compact={compact} module={renderModule()}
      goTo={goTo} toggleComplete={toggleComplete} completeAndNext={completeAndNext} />
  );
  const PANEL_W = 'min(700px, 60vw)';

  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', background: C.pageBg }}>
      {/* Top bar */}
      <div className="no-print" style={{ height: 56, flexShrink: 0, display: 'flex', alignItems: 'center', gap: 14, padding: '0 20px', background: C.cardBg, borderBottom: `1px solid ${C.border}` }}>
        <Btn small icon={Ic.back} onClick={onExit}>Templates</Btn>
        <div style={{ width: 26, height: 26, borderRadius: '50%', background: C.orb, flexShrink: 0 }} />
        <div style={{ fontFamily: BODY, fontWeight: 700, fontSize: 15, color: C.ink, letterSpacing: '-.2px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{projectName}</div>
        <Chip small label={task} />
        <span title={template.summary}><Chip small label={`Template · ${template.name}`} color={C.ink3} /></span>
        <div style={{ flex: 1 }} />
        <ViewToggle view={view} setView={setView} />
        <MonoLabel color={C.ink3}>{pad(completed.length)} / {total} complete</MonoLabel>
      </div>

      {view === 'list' ? (
        <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
          {/* Sidebar */}
          <aside className="no-print" style={{ width: 252, flexShrink: 0, background: C.pageBg, borderRight: `1px solid ${C.border}`, overflowY: 'auto', padding: '18px 12px 24px' }}>
            <div style={{ padding: '0 10px 16px' }}>
              <div style={{ height: 3, background: C.border, borderRadius: 2, overflow: 'hidden' }}>
                <div style={{ width: `${(completed.length / total) * 100}%`, height: '100%', background: C.teal, transition: 'width .3s ease' }} />
              </div>
            </div>
            {template.stages.map(ph => (
              <div key={ph} style={{ marginBottom: 14 }}>
                <MonoLabel style={{ padding: '0 10px 6px' }}>{ph}</MonoLabel>
                {steps.filter(s => s.phase === ph).map(s => (
                  <StepItem key={s.n} step={s} active={s.n === activeStep} done={completed.includes(s.n)} onClick={() => goTo(s.n)} />
                ))}
              </div>
            ))}
          </aside>

          {/* Main */}
          <main className="print-unclip" style={{ flex: 1, overflowY: 'auto', background: C.cardBg }}>
            <div style={{ maxWidth: 1080, margin: '0 auto', padding: '34px 44px 64px' }}>{body(false)}</div>
          </main>
        </div>
      ) : (
        <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
          <MapView template={template} completed={completed} activeStep={activeStep} panelOpen={panelOpen} projectData={projectData} onOpen={openStep} />

          {/* Step panel */}
          <aside className="print-unclip" style={{ width: panelOpen ? PANEL_W : 0, flexShrink: 0, overflow: 'hidden', background: C.cardBg, borderLeft: panelOpen ? `1px solid ${C.border}` : 'none', boxShadow: panelOpen ? '-10px 0 30px rgba(15,14,12,.05)' : 'none', transition: 'width .24s ease' }}>
            <div className="print-unclip" style={{ width: PANEL_W, height: '100%', overflowY: 'auto' }}>
              <div className="no-print" style={{ position: 'sticky', top: 0, zIndex: 5, display: 'flex', alignItems: 'center', gap: 6, padding: '10px 16px', background: 'rgba(255,255,255,.94)', backdropFilter: 'blur(6px)', borderBottom: `1px solid ${C.border}` }}>
                <Btn small icon={Ic.chevLeft} disabled={activeStep === 1} onClick={() => goTo(activeStep - 1)} title="Previous step" />
                <Btn small icon={Ic.chevRight} disabled={activeStep === total} onClick={() => goTo(activeStep + 1)} title="Next step" />
                <div style={{ flex: 1 }} />
                <Btn small icon={Ic.launch} onClick={() => { setView('list'); setPanelOpen(false); }}>Open in list</Btn>
                <Btn small icon={Ic.close} onClick={() => setPanelOpen(false)} title="Close (Esc)" />
              </div>
              {panelOpen && <div style={{ padding: '22px 30px 48px' }}>{body(true)}</div>}
            </div>
          </aside>
        </div>
      )}
    </div>
  );
}

/* ─── ROOT: templates gallery → launcher → workspace ─────────── */
function NiaTemplatesApp() {
  const [picked, setPicked] = useState(null);   // template waiting on the launcher
  const [session, setSession] = useState(null);
  if (session) {
    return <ProjectWorkspace template={session.template} projectName={session.project} task={session.task} onExit={() => setSession(null)} />;
  }
  return (
    <>
      <TemplatesGallery catalog={CATALOG} onUse={t => setPicked(t)} />
      {picked && (
        <ProjectLauncher template={picked} task={picked.launch.task} domain={picked.launch.domain}
          onClose={() => setPicked(null)} onLaunch={s => { setSession({ ...s, template: picked }); setPicked(null); }} />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<NiaTemplatesApp />);
  </script>
