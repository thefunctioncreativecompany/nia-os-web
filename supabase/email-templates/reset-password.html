<!-- Paste into Supabase → Authentication → Email Templates. Subject: Reset your password -->
<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#F9F9F9;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F9F9F9;padding:40px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E2E2E2;border-radius:16px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1F1F1F;">
        <tr><td style="padding:32px 32px 0;">
          <div style="font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-size:22px;font-weight:700;letter-spacing:0.02em;">NIA</div>
        </td></tr>
        <tr><td style="padding:24px 32px 0;">
          <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;font-weight:700;">Reset your password</h1>
          <p style="margin:0;font-size:15px;line-height:1.6;color:#6B6B6B;">We got a request to reset your Nia password.</p>
        </td></tr>
        <tr><td style="padding:28px 32px 0;">
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password" style="display:inline-block;background:#005FB8;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:700;padding:14px 28px;border-radius:999px;">Choose a new password</a>
        </td></tr>
        <tr><td style="padding:28px 32px 0;">
          <p style="margin:0 0 10px;font-size:14px;line-height:1.6;color:#6B6B6B;">Or enter this code on the reset screen:</p>
          <div style="display:inline-block;font-family:Menlo,Consolas,monospace;font-size:28px;font-weight:700;letter-spacing:0.3em;background:#F9F9F9;border:1px solid #E2E2E2;border-radius:12px;padding:12px 18px;">{{ .Token }}</div>
        </td></tr>
        <tr><td style="padding:28px 32px 32px;">
          <p style="margin:0;font-size:13px;line-height:1.6;color:#6B6B6B;">If you didn't ask for this, you can ignore this email. Your password won't change.</p>
        </td></tr>
      </table>
      <p style="margin:20px 0 0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;color:#6B6B6B;">NIA is an AI-enabled content production operating system.</p>
    </td></tr>
  </table>
</body>
</html>
