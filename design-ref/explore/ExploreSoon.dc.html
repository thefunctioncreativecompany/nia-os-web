<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1F1E1D}a:hover{color:#000}
.ib{transition:background .2s}
.ib:hover{background:#F4F4F3}
a:focus-visible,button:focus-visible{outline:2px solid #1F1E1D;outline-offset:2px}
.btn{transition:transform .35s cubic-bezier(.16,1,.3,1),background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.dark:hover{background:#000}
.btn.line:hover{background:#F4F4F3}
.panel{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translate(-50%,-44%)}to{opacity:1;transform:translate(-50%,-50%)}}
.dot{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,175,110,.45)}50%{box-shadow:0 0 0 6px rgba(31,175,110,0)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.panel{transform:translate(-50%,-50%)}}
</style>
</helmet>

<a href="#" aria-current="page" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; margin: 0 6px; border-radius: 999px; background: #EEEDEC; color: #1F1E1D; font-size: 15px; font-weight: 500; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#73726C" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M14.5 9.5l-1.5 4-4 1.5 1.5-4z"></path></svg>Explore</a>

<main onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}" style="position: relative; height: 920px; overflow: hidden; background: #FFFFFF">

</sc-for>
<div class="panel" style="position: absolute; left: 50%; top: 50%; z-index: 200; width: min(470px, calc(100% - 40px)); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 36px 36px 32px; text-align: center; border: 1px solid #E2E2E2; border-radius: 20px; background: rgba(255,255,255,0.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 30px 80px rgba(31,30,29,0.14)">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border: 1px solid #E2E2E2; border-radius: 999px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; color: #4A4945"><span class="dot" style="width: 7px; height: 7px; border-radius: 999px; background: #1FAF6E"></span>COMING SOON</span>

<p style="margin: 0; max-width: 360px; font-size: 15px; line-height: 1.55; color: #5F5E59">Browse films, director's notes and electronic press kits from across Nia, then compare any two side by side. Opens February 2027.</p>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px">
<a href="#" class="btn dark" style="display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 999px; background: #1F1E1D; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none">Notify me</a>
<a href="ExploreLibrary.dc.html" class="btn line" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #E2E2E2; color: #1F1E1D; font-size: 14px; font-weight: 500; text-decoration: none">Preview Explore<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</div>

</div>

<script type="text/x-dc" data-dc-script data-props='{"speed":{"editor":"range","default":1,"min":0,"max":4,"step":0.1,"section":"Motion"},"blur":{"editor":"range","default":2,"min":0,"max":10,"step":0.5,"unit":"px","section":"Motion"},"$preview":{"width":1440,"height":1000}}'>
var P=[["#2b1d14","#c8742f"],["#0f2236","#4f86b5"],["#1d2a16","#7aa04a"],["#2a0f12","#c2403a"],["#1a1a1f","#8e8aa3"],["#302214","#e0a54a"],["#12262a","#3f9aa0"],["#28171f","#b0607e"],["#20201c","#b8b39a"],["#13131a","#5b5f8c"]];
var IMG=["/_blob/2e618fa6360beed7421e2d1e1a514aa2","/_blob/ae942bb6063c538a2d5875f3312677cc","/_blob/9dfbe296b67cc5b530c1e921fe04cf20","/_blob/3d67e22435f5585acb1ba9e52c6e2a05","/_blob/889aa73f2d5a6d0b180a046ae65e21dd","/_blob/682fd58151e8e95aa521675d9214b147","/_blob/3715c3e199afe3a4d63979f8023a5252","/_blob/1240ca10e13295816ff3bbcc9a125c3e","/_blob/f56d7cf9590538c194f74185734db2b4","/_blob/90fcce6ccacdaa90c4419d3f25f4d50c","/_blob/6e557a1316a79bb6a0ae6600e6f26c41","/_blob/ff3877979b7426a10b745595b90210c2","/_blob/e0deda009b612d28f60d365489a0d931","/_blob/02918f5fcbce8944023814b29afdf76d"];
class Component extends DCLogic {
  componentDidMount(){
    this._rm=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    if(this._rm)return;
    var tick=()=>{var st=this.state||{};var mx=st.mx==null?0.5:st.mx;var sp=this.props.speed==null?1:this.props.speed;
      this.setState({a:((st.a||0)+(0.07+(mx-0.5)*1.2)*sp)%360});this._raf=requestAnimationFrame(tick);};
    this._raf=requestAnimationFrame(tick);
  }
  componentWillUnmount(){cancelAnimationFrame(this._raf);}
  move(e){var r=e.currentTarget.getBoundingClientRect();this.setState({mx:(e.clientX-r.left)/r.width,my:(e.clientY-r.top)/r.height});}
  renderVals(){
    var st=this.state||{};var a=st.a||0;var my=st.my==null?0.5:st.my;var n=14;var ry=16+my*16;var bl=this.props.blur==null?2:this.props.blur;
    var items=[];
    for(var i=0;i<n;i++){var th=(a+i*360/n)*Math.PI/180;var sn=Math.sin(th);var d=(sn+1)/2;
      items.push({img:IMG[i%IMG.length],x:(50+Math.cos(th)*41).toFixed(2),y:(50+sn*ry).toFixed(2),s:(0.55+0.6*d).toFixed(3),
        z:Math.round(d*100),o:(0.35+0.65*d).toFixed(2),bl:(bl*(1-d)).toFixed(1),sat:(0.5+0.5*d).toFixed(2)});}
    return {items:items,onMove:(e)=>this.move(e),onLeave:()=>this.setState({mx:0.5,my:0.5})};
  }
}
</script>
