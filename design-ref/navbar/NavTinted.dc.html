<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explore navbar: tinted glass, search open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E6E6E6}a:hover{color:#3794FF}
</style>
</helmet>
<div style="width: 1440px; height: 560px; position: relative; overflow: hidden; background: #1F1F1F; font-family: Geist, system-ui, sans-serif; color: #E6E6E6">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 0 32px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
    <sc-for list="{{posters}}" as="p" hint-placeholder-count="12">
      <div style="height: 320px; border-radius: 12px; background: {{p}}"></div>
    </sc-for>
  </div>
  <header style="position: absolute; top: 0; left: 0; right: 0; height: 64px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; padding: 0 24px; background: rgba(31,31,31,0.55); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); border-bottom: 1px solid rgba(255,255,255,0.08)">
    <nav aria-label="Main" style="display: flex; align-items: center; gap: 2px">
      <a href="#" style="font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 999px; text-decoration: none; color: #BDBDBD">Home</a>
      <a href="#" style="font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 999px; text-decoration: none; color: #BDBDBD">Projects</a>
      <a href="#" style="font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 999px; text-decoration: none; color: #BDBDBD">Templates</a>
      <a href="#" aria-current="page" style="font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; text-decoration: none; color: #3794FF; background: rgba(55,148,255,0.14)">Explore</a>
      <a href="#" style="font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 999px; text-decoration: none; color: #8F8F8F">Inbox</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 10px">
      <label style="width: 560px; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 16px; border-radius: 999px; background: rgba(38,38,38,0.85); border: 1px solid rgba(55,148,255,0.55)">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span style="flex: 1; font-size: 14px; color: #A0A0A0">Try 'films like Sinners'</span>
        <button type="button" aria-label="Search by colour" style="width: 32px; height: 32px; border-radius: 999px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6E6E6" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"></path><circle cx="7.5" cy="11" r="1.2"></circle><circle cx="10" cy="7" r="1.2"></circle><circle cx="15" cy="7.5" r="1.2"></circle></svg>
        </button>
        <button type="button" aria-label="Search with a picture" style="width: 32px; height: 32px; border-radius: 999px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6E6E6" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
        <button type="button" aria-label="Search by voice" style="width: 32px; height: 32px; border-radius: 999px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6E6E6" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        </button>
      </label>
      <button type="button" aria-label="New project" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(38,38,38,0.85); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6E6E6" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <div style="display: flex; justify-content: flex-end">
      <button type="button" aria-label="Your profile" style="display: flex; align-items: center; gap: 6px; border: none; background: transparent; cursor: pointer; padding: 4px">
        <span style="width: 32px; height: 32px; border-radius: 999px; background: #4A4A4A; display: block"></span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#BDBDBD" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
  </header>
  <div aria-hidden="true" style="position: absolute; top: 64px; left: 0; right: 0; height: 40px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); -webkit-mask-image: linear-gradient(to bottom, #000, transparent); mask-image: linear-gradient(to bottom, #000, transparent)"></div>
  <section aria-label="Try" style="position: absolute; top: 74px; left: 50%; transform: translateX(-50%); margin-left: -25px; width: 560px; box-sizing: border-box; padding: 18px; border-radius: 20px; background: rgba(38,38,38,0.78); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 12px">
    <p style="margin: 0; font-size: 13px; font-weight: 600; color: #E6E6E6">Try, for your work</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{tries}}" as="t" hint-placeholder-count="6">
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: rgba(255,255,255,0.08); color: #E6E6E6; font: 500 13px Geist, sans-serif; cursor: pointer">{{t}}</button>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 12px; color: #A0A0A0">From your projects (Night Market lookbook, Brand film for Spunge), what you've saved and your recent searches.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      tries: ['night streets like Night Market lookbook', 'product close-ups for Spunge', 'warm-palette commercials', 'music videos shot on iPhone', 'Made in Africa documentaries', 'films like Sinners'],
      posters: ['#4E4842', '#3E4650', '#5A4E44', '#2F2D2B', '#4A5048', '#615648', '#38404A', '#544A3E', '#46403B', '#5C564F', '#3A3531', '#4B535B']
    };
  }
}
</script>
</body>
</html>
